# InterfaceManifest.yml
#
# Canonical description of the daemon's external and internal message
# surface. Every cross-module contract lives here -- in-process
# MessageBus event shapes, the D-Bus method/signal surface, and the
# protocol-specific wire frames that ride inside SendData payloads.
#
# The CMake-time code generator (scripts/codegen/) reads this file and
# emits MessageBus.{hpp,cpp} event structs, the D-Bus method/signal
# bindings in DBusBackend.cpp, and per-module codec skeletons. A
# discrepancy between the manifest and the generated files is a bug in
# the manifest; a discrepancy between manifest and hand-written code
# referencing the generated names is a bug in that hand-written code.
#
# ----- Schema overview ----------------------------------------------
# Top-level sections (each described in its own block below):
#
#   structs:       reusable nested shapes referenced by events / DBus
#   events:        MessageBus event definitions (state / config /
#                  transient / command categories)
#   dbus:          methods + signals + bus_name / object_path / interface
#   modules:       per-feature codec definitions. Wire-specific bits
#                  (class_byte, prefix, per-command byte) live under
#                  nested `wire:` blocks so the surrounding schema
#                  stays protocol-agnostic — a future second-protocol
#                  daemon (Zigbee, KNX, …) reuses the same schema with
#                  its own `wire:` keys.
#   translations:  rules driving the cc-translator module — subscribe
#                  to a raw event, run a codec, republish a typed event.
#
# ----- Type system ---------------------------------------------------
# Field types map cleanly onto both C++ and D-Bus:
#
#   bool         cpp: bool                          dbus: b
#   u8           cpp: std::uint8_t                  dbus: y
#   u16          cpp: std::uint16_t                 dbus: q
#   u32          cpp: std::uint32_t                 dbus: u
#   u64          cpp: std::uint64_t                 dbus: t
#   i32          cpp: std::int32_t                  dbus: i
#   string       cpp: std::string                   dbus: s
#   bytes        cpp: std::vector<std::uint8_t>     dbus: ay
#   array<T, N>  cpp: std::array<T, N>              dbus: a<T> (no length check)
#   list<T>      cpp: std::vector<T>                dbus: a<T>
#   struct ref   cpp: <Name>                        dbus: (<fields...>)
#
# `default:` documents the wire-level default the codegen should emit
# in the C++ struct's member initializer. `doc:` is human-only.

version: 1

# =====================================================================
# 1. Nested structs
# =====================================================================
# Reusable shapes referenced by `events` and the D-Bus surface. Each
# becomes a plain C++ struct in the codegen output; they are not
# subscribable/publishable on the bus on their own.

structs:

  - name: NodeInfo
    doc: One node entry in the persistent registry.
    fields:
      - { name: nodeId,         type: u8,     default: 0 }
      - { name: basicType,      type: u8,     default: 0 }
      - { name: genericType,    type: u8,     default: 0 }
      - { name: specificType,   type: u8,     default: 0 }
      - { name: commandClasses, type: bytes }

  - name: AcceptedDongleConfig
    doc: One accepted USB dongle identity (VID/PID/name).
    fields:
      - { name: vid,  type: string, doc: "4-char lowercase hex" }
      - { name: pid,  type: string, doc: "4-char lowercase hex" }
      - { name: name, type: string }

  - name: EndpointMember
    doc: |
      One node:endpoint pair carried by Multi Channel Association
      commands and reports. Mirrors the application-layer codec's
      EndpointMember; redeclared so the bus header is independent of
      application/.
    fields:
      - { name: nodeId,   type: u8, default: 0 }
      - { name: endpoint, type: u8, default: 0 }

# =====================================================================
# 2. MessageBus events
# =====================================================================
# Every event published on the in-process bus. `category` controls how
# the codegen treats it:
#
#   state      - retained: late subscribers receive the latest value on
#                subscribe. Specialize IsRetained<T> to true_type.
#   config     - retained, populated once at startup by Config.
#   transient  - not retained.
#   command    - not retained; published from external transports,
#                consumed by ProtocolThread.
#
# `direction` is documentation: who publishes, who subscribes.

events:

  # ---- 2a. State (retained) ---------------------------------------
  - name: DongleStatus
    category: state
    direction: { publishers: [zwave-dongle], subscribers: [external-api, zwave-protocol] }
    doc: Lifecycle state of the Z-Wave dongle's serial attachment.
    fields:
      - { name: connected, type: bool,   default: false }
      - { name: ttyPath,   type: string, doc: "empty unless connected" }

  - name: DongleInfo
    category: state
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: |
      Static introspection from FUNC_ID_GET_VERSION + FUNC_ID_MEMORY_GET_ID
      after the serial port opens.
    fields:
      - { name: libraryVersion,   type: string, doc: "e.g. 'Z-Wave 6.07'" }
      - { name: libraryType,      type: u8,     default: 0 }
      - { name: homeId,           type: bytes,  doc: "4 bytes" }
      - { name: controllerNodeId, type: u8,     default: 0 }

  - name: InitData
    category: state
    direction: { publishers: [zwave-protocol], subscribers: [external-api, node-registry] }
    doc: FUNC_ID_SERIAL_API_GET_INIT_DATA (0x02) RESPONSE — startup snapshot.
    fields:
      - { name: serialApiVersion, type: u8,    default: 0 }
      - { name: capabilities,     type: u8,    default: 0, doc: "bit 0=secondary, 1=no-send, 2=SIS, 3=real-primary" }
      - { name: chipType,         type: u8,    default: 0 }
      - { name: chipVersion,      type: u8,    default: 0 }
      - { name: nodeIds,          type: bytes, doc: "expanded node bitmap" }

  - name: NodeListChanged
    category: state
    direction: { publishers: [node-registry], subscribers: [external-api] }
    doc: Snapshot of the node registry. Republished on add/remove/seed/setHomeId.
    fields:
      - { name: nodes, type: list<NodeInfo> }

  - name: SessionStatus
    category: state
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: |
      Mirror of the protocol thread's inclusion/exclusion session
      tracker, so external observers can answer "is a session in
      flight" without reaching into protocol internals.
    fields:
      - { name: active,    type: bool, default: false }
      - { name: commandId, type: u8,   default: 0, doc: "HostApi::CMD_ADD_NODE_TO_NETWORK / CMD_REMOVE_NODE_FROM_NETWORK / 0" }
      - { name: sessionId, type: u8,   default: 0 }

  - name: DaemonError
    category: state
    direction: { publishers: [zwave-protocol, zwave-dongle, external-api, config], subscribers: [external-api] }
    doc: |
      Structured error feed — the operator-visible counterpart to
      Logger::error / journald lines. Retained so a D-Bus client
      connecting after a failure still sees the most recent one
      (mirrors how GetNetworkStatus exposes the latest cached
      DongleStatus / DongleInfo). An empty `message` on the default-
      constructed value means "no error yet"; publishers may also
      publish a default-constructed DaemonError as an explicit
      "recovered, no current problem" signal.

      `severity` aligns with Logger::Level (1..3) plus a Critical
      step for failures that imply the daemon can't make progress at
      all. `source` is the publishing module's name as a free-form
      string ("zwave-protocol", "zwave-dongle", etc) so adding a new
      publisher doesn't require an enum extension. `code` is one of
      the constants below — extend the enum when a new operator-
      meaningful failure class shows up.
    constants:
      - { name: SEVERITY_INFO,     value: 1 }
      - { name: SEVERITY_WARN,     value: 2 }
      - { name: SEVERITY_ERROR,    value: 3 }
      - { name: SEVERITY_CRITICAL, value: 4, doc: "daemon can't make progress in its current mode" }

      # Code high-nibble groups by source module so a quick visual
      # scan tells you where the failure came from; low nibble is a
      # within-module ordinal. Codegen emits constants as `std::uint8_t`
      # today, so codes must fit in a byte; if/when the manifest gets a
      # constant-type hint, this layout can expand to u16.
      - { name: CODE_NONE,                        value: 0x00, doc: "default — no error to report" }
      - { name: CODE_DONGLE_OPEN_FAILED,          value: 0x10, doc: "serial port open() / configure failed" }
      - { name: CODE_DONGLE_INTROSPECTION_FAILED, value: 0x11, doc: "GET_VERSION or MEMORY_GET_ID didn't answer" }
      - { name: CODE_UDEV_INIT_FAILED,            value: 0x20, doc: "libudev context or monitor creation failed" }
      - { name: CODE_DBUS_BIND_FAILED,            value: 0x30, doc: "couldn't acquire the system-bus name" }
      - { name: CODE_EXTERNAL_API_NO_BACKEND,     value: 0x31, doc: "no external-API backend compiled in" }
      - { name: CODE_CONFIG_LOAD_FAILED,          value: 0x40, doc: "config file present but unreadable / malformed" }
      - { name: CODE_ORCHESTRATOR_NO_CONTROLLER,  value: 0x50, doc: "inclusion lifeline wanted but controller node id unknown" }
    fields:
      - { name: severity, type: u8,     default: SEVERITY_INFO }
      - { name: source,   type: string, doc: "publishing module — e.g. 'zwave-protocol'" }
      - { name: code,     type: u8,     default: CODE_NONE }
      - { name: message,  type: string, doc: "human-readable; empty for default 'no error' value" }

  - name: PolicyChanged
    category: state
    direction: { publishers: [policy-register], subscribers: [orchestrator] }
    doc: |
      A device-default or per-node policy was created / updated / deleted
      in the PolicyRegister (#66). Orchestrators that have already acted
      on a node re-evaluate its effective policy when this fires.
      `nodeId == 0` means a *device-level* change (the register doesn't
      know which nodes it affects) — treat it as a wildcard "re-evaluate
      anything that might be affected." Retained so an orchestrator that
      subscribes late still sees the most recent change.
    fields:
      - { name: nodeId, type: u8, default: 0, doc: "0 = device-level / wildcard" }

  - name: NodeMetadataChanged
    category: state
    direction: { publishers: [node-metadata], subscribers: [external-api] }
    doc: |
      A human-authored metadata key for `nodeId` was set / cleared in the
      NodeMetadata store (#83). Re-emitted as a D-Bus signal so a UI can
      refresh the node's labels without polling. Retained so a client that
      subscribes late sees the most recent change. Purely descriptive —
      the daemon takes no action on it.
    fields:
      - { name: nodeId, type: u8, default: 0 }

  # ---- 2b. Configuration (retained, set once at startup) -----------
  # Published once by Config (priority 102) after parsing zwaved.conf;
  # consumers subscribe from their own constructor and pick up the
  # cached value via replay-on-subscribe.

  - name: LoggerConfig
    category: config
    direction: { publishers: [config], subscribers: [logger] }
    doc: Logger threshold. minLevel is the underlying integer of Logger::Level.
    fields:
      - { name: minLevel, type: u8, default: 1, doc: "0=Debug, 1=Info, 2=Warn, 3=Error" }

  - name: DonglesConfig
    category: config
    direction: { publishers: [config], subscribers: [zwave-dongle] }
    doc: USB dongles the monitor thread will recognise.
    fields:
      - { name: accept, type: list<AcceptedDongleConfig> }

  - name: StorageConfig
    category: config
    direction: { publishers: [config], subscribers: [node-registry] }
    doc: Storage paths. Empty stateDir means fall back to env / built-in default.
    fields:
      - { name: stateDir, type: string }

  - name: BehaviorConfig
    category: config
    direction: { publishers: [config], subscribers: [zwave-protocol] }
    doc: Daemon-wide feature toggles.
    fields:
      - { name: autoLifeline, type: bool, default: true }

  # ---- 2c. Transient protocol events ------------------------------

  - name: ApplicationCommand
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api, cc-translator] }
    doc: Unsolicited CC frame inside FUNC_ID_APPLICATION_COMMAND_HANDLER (0x04).
    fields:
      - { name: rxStatus,     type: u8,    default: 0 }
      - { name: sourceNodeId, type: u8,    default: 0 }
      - { name: ccData,       type: bytes }

  - name: NodeInclusionStatus
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: Decoded callback for FUNC_ID_ZW_ADD_NODE_TO_NETWORK (0x4A).
    fields:
      - { name: sessionId,          type: u8,  default: 0 }
      - { name: status,             type: u8,  default: 0 }
      - { name: nodeId,             type: u16, default: 0 }
      - { name: basicDeviceType,    type: u8,  default: 0 }
      - { name: genericDeviceType,  type: u8,  default: 0 }
      - { name: specificDeviceType, type: u8,  default: 0 }
      - { name: commandClasses,     type: bytes }

  - name: NodeIncluded
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [orchestrator] }
    doc: |
      High-level "a node finished inclusion" event — published by
      ProtocolThread when an ADD_NODE session reaches its terminal
      status, carrying the node's supported/controlled command-class
      list captured during inclusion. InclusionOrchestrator (#67)
      consumes this (instead of the raw NodeInclusionStatus status
      codes) to apply the lifeline + effective policy. `commandClasses`
      is the raw NIF list including the COMMAND_CLASS_MARK (0xEF)
      separator between the supported and controlled halves.
    fields:
      - { name: nodeId,         type: u8,    default: 0 }
      - { name: commandClasses, type: bytes }

  - name: NodeExclusionStatus
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: Decoded callback for FUNC_ID_ZW_REMOVE_NODE_FROM_NETWORK (0x4B).
    fields:
      - { name: sessionId,          type: u8,  default: 0 }
      - { name: status,             type: u8,  default: 0 }
      - { name: nodeId,             type: u16, default: 0 }
      - { name: basicDeviceType,    type: u8,  default: 0 }
      - { name: genericDeviceType,  type: u8,  default: 0 }
      - { name: specificDeviceType, type: u8,  default: 0 }
      - { name: commandClasses,     type: bytes }

  - name: SendDataCallback
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: Decoded callback for FUNC_ID_ZW_SEND_DATA (0x13) completion.
    fields:
      - { name: callbackId, type: u8, default: 0 }
      - { name: txStatus,   type: u8, default: 0, doc: "0=OK, 1=NoAck, 2=Fail, 3=NotIdle, 4=NoRoute, 5=Verified" }

  - name: RemoveFailedNodeStatus
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: |
      Progress signal for FUNC_ID_ZW_REMOVE_FAILED_NODE_ID (0x61).
      Emitted twice for a typical removal: phase=PHASE_RESPONSE
      carries the synchronous response, phase=PHASE_CALLBACK the
      async callback.
    constants:
      - { name: PHASE_RESPONSE, value: 0 }
      - { name: PHASE_CALLBACK, value: 1 }
    fields:
      - { name: nodeId,    type: u8, default: 0 }
      - { name: sessionId, type: u8, default: 0 }
      - { name: phase,     type: u8, default: PHASE_RESPONSE }
      - { name: status,    type: u8, default: 0, doc: "interpretation depends on phase" }

  - name: RequestNodeInfoStatus
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api] }
    doc: |
      Synchronous response to FUNC_ID_ZW_REQUEST_NODE_INFO (0x60).
      `accepted` says whether the dongle accepted the request and
      will attempt to ferry it over the air. The actual NodeInfo
      payload arrives later — unsolicited — as a NodeInfoUpdate
      event (which fires for both requested and unprompted NIFs).
    fields:
      - { name: nodeId,    type: u8,   default: 0 }
      - { name: sessionId, type: u8,   default: 0 }
      - { name: accepted,  type: bool, default: false }

  - name: NodeInfoUpdate
    category: transient
    direction: { publishers: [zwave-protocol], subscribers: [external-api, node-registry] }
    doc: |
      Decoded FUNC_ID_APPLICATION_UPDATE (0x49) payload. Fires both in
      response to a prior REQUEST_NODE_INFO and unsolicited (a node
      sending a NIF after waking up); correlated to a request only by
      nodeId. `status` distinguishes the case:
        0x81 NODE_INFO_REQ_FAILED  — node didn't reply within the
                                     dongle's window (sleeping / out
                                     of range). device-class and CCs
                                     are unset.
        0x84 NODE_INFO_RECEIVED    — full NodeInfo arrived. The
                                     daemon also updates NodeRegistry.
      Other statuses (SUC_ID, NEW_ID_ASSIGNED, ...) pass through; the
      payload-bearing fields are only populated for NODE_INFO_RECEIVED.
    constants:
      - { name: STATUS_NODE_INFO_REQ_FAILED, value: 0x81 }
      - { name: STATUS_NODE_INFO_RECEIVED,   value: 0x84 }
    fields:
      - { name: status,             type: u8,    default: 0 }
      - { name: nodeId,             type: u8,    default: 0 }
      - { name: basicDeviceType,    type: u8,    default: 0 }
      - { name: genericDeviceType,  type: u8,    default: 0 }
      - { name: specificDeviceType, type: u8,    default: 0 }
      - { name: commandClasses,     type: bytes }

  # ---- 2c'. Typed CC reports ---------------------------------------
  # The cc-translator module subscribes to ApplicationCommand events,
  # runs the application/ codec decoders, and republishes typed events
  # like the ones below. Lets external-api emit typed D-Bus signals
  # without ever including a CC codec header — the bus stays the only
  # seam between modules.

  - name: BinarySwitchReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Binary Switch (CC 0x25) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Binary Switch Report. State follows the
      BinarySwitch::State enum: 0=Off, 1=On, 2=Unknown.
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: state,        type: u8, default: 0, doc: "0=Off, 1=On, 2=Unknown" }

  - name: IndicatorReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Indicator (CC 0x87) Report. Republished by the cc-translator
      from inbound ApplicationCommand frames whose ccData parses as an
      Indicator Report (v1). `value`: 0x00 off, 0x01..0x63 level, 0xFF on.
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: value,        type: u8, default: 0 }

  - name: SupervisionReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Supervision (CC 0x6C) Report. Republished by the cc-translator
      from inbound ApplicationCommand frames whose ccData parses as a
      Supervision Report. `sessionId` echoes the GET's nonce; `status`:
      0x00 no support, 0x01 working, 0x02 fail, 0xFF success;
      `moreStatusUpdates` means a final report follows after `duration`.
    fields:
      - { name: sourceNodeId,      type: u8,   default: 0 }
      - { name: sessionId,         type: u8,   default: 0 }
      - { name: moreStatusUpdates, type: bool, default: false }
      - { name: status,            type: u8,   default: 0 }
      - { name: duration,          type: u8,   default: 0 }

  - name: MultiChannelEndPointReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Multi Channel (CC 0x60) End Point Report (#13). How many
      endpoints the node presents. `dynamic`: the count can change;
      `identical`: all endpoints share capabilities (one CapabilityGet
      describes them all).
    fields:
      - { name: sourceNodeId,  type: u8,   default: 0 }
      - { name: endpointCount, type: u8,   default: 0 }
      - { name: dynamic,       type: bool, default: false }
      - { name: identical,     type: bool, default: false }

  - name: MultiChannelCapabilityReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Multi Channel (CC 0x60) Capability Report (#13). One endpoint's
      generic/specific device class and the Command Classes it supports.
    fields:
      - { name: sourceNodeId,   type: u8,    default: 0 }
      - { name: endpoint,       type: u8,    default: 0 }
      - { name: generic,        type: u8,    default: 0 }
      - { name: specific,       type: u8,    default: 0 }
      - { name: commandClasses, type: bytes }

  - name: BatteryReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Battery (CC 0x80) Report. Republished by the cc-translator
      from inbound ApplicationCommand frames whose ccData parses as a
      Battery Report. `level` is the wire byte: 0x00..0x64 is a
      percentage (0–100 %); 0xFF means "battery low" with no precise
      gauge — surfaced separately as `lowBattery` so callers don't
      have to special-case the sentinel.
    fields:
      - { name: sourceNodeId, type: u8,   default: 0 }
      - { name: level,        type: u8,   default: 0 }
      - { name: lowBattery,   type: bool, default: false }

  - name: SensorMultilevelReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Sensor Multilevel (CC 0x31) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Sensor Multilevel Report. The reading is
      `value / 10^precision` in the unit selected by `(sensorType,
      scale)`. Raw integer fields are carried so no precision is lost on
      the wire; clients apply the decimal shift + unit lookup.
    fields:
      - { name: sourceNodeId, type: u8,  default: 0 }
      - { name: sensorType,   type: u8,  default: 0 }
      - { name: scale,        type: u8,  default: 0 }
      - { name: precision,    type: u8,  default: 0 }
      - { name: value,        type: i32, default: 0, doc: "raw; reading = value / 10^precision" }

  - name: SensorBinaryReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Sensor Binary (CC 0x30) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Sensor Binary Report. `value` is 0x00 (idle) or 0xFF
      (active/triggered). `sensorType` is 0 for v1 reports (no type byte
      on the wire) and the device's sensor-type code for v2+.
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: sensorType,   type: u8, default: 0 }
      - { name: value,        type: u8, default: 0, doc: "0x00 idle / 0xFF active" }

  - name: NotificationReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Notification (CC 0x71) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a v3+ Notification Report. Carries the
      `(notificationType, event)` pair, the notificationStatus byte, and
      the variable-length event parameters. Legacy v1 alarm fields are
      not surfaced here (only on the raw ApplicationCommand signal).
    fields:
      - { name: sourceNodeId,     type: u8,    default: 0 }
      - { name: notificationType, type: u8,    default: 0 }
      - { name: event,            type: u8,    default: 0 }
      - { name: status,           type: u8,    default: 0 }
      - { name: parameters,       type: bytes }

  - name: MeterReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Meter (CC 0x32) Report. Republished by the cc-translator from
      inbound ApplicationCommand frames whose ccData parses as a v3+ Meter
      Report. `value` is the current reading (raw signed; the real value is
      `value / 10^precision` in the unit selected by `(meterType, scale)`).
      `deltaTime` is seconds since the previous sample; when it is nonzero
      the frame also carried a `previousValue` (raw, same scaling) and
      `hasPrevious` is true, letting clients compute an instantaneous rate
      without keeping state. meterType: 1 electric, 2 gas, 3 water.
      rateType: 1 import, 2 export.
    fields:
      - { name: sourceNodeId,  type: u8,   default: 0 }
      - { name: meterType,     type: u8,   default: 0 }
      - { name: rateType,      type: u8,   default: 0 }
      - { name: scale,         type: u8,   default: 0 }
      - { name: precision,     type: u8,   default: 0 }
      - { name: value,         type: i32,  default: 0, doc: "raw; reading = value / 10^precision" }
      - { name: deltaTime,     type: u16,  default: 0, doc: "seconds since previousValue sample; 0 = none" }
      - { name: previousValue, type: i32,  default: 0, doc: "raw; valid only when hasPrevious" }
      - { name: hasPrevious,   type: bool, default: false }

  - name: ThermostatModeReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Thermostat Mode (CC 0x40) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Thermostat Mode Report. `mode`: 0 off, 1 heat, 2 cool,
      3 auto, 6 fan only, 8 dry, … (raw byte; naming left to clients).
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: mode,         type: u8, default: 0 }

  - name: ThermostatSetpointReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Thermostat Setpoint (CC 0x43) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Setpoint Report. The target temperature is
      `value / 10^precision` in the unit selected by `scale` (0 = °C,
      1 = °F). setpointType: 1 heating, 2 cooling, … Raw fields are carried
      (shared precision/scale/size encoding with Sensor Multilevel).
    fields:
      - { name: sourceNodeId, type: u8,  default: 0 }
      - { name: setpointType, type: u8,  default: 0 }
      - { name: scale,        type: u8,  default: 0 }
      - { name: precision,    type: u8,  default: 0 }
      - { name: value,        type: i32, default: 0, doc: "raw; reading = value / 10^precision" }

  - name: ThermostatOperatingStateReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Thermostat Operating State (CC 0x42) Report — what the HVAC is
      currently doing. Republished by the cc-translator from inbound
      ApplicationCommand frames whose ccData parses as an Operating State
      Report. `state`: 0 idle, 1 heating, 2 cooling, 3 fan only, 4 pending
      heat, 5 pending cool, 6 vent/economizer. Read-only CC (no Set).
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: state,        type: u8, default: 0 }

  - name: ThermostatFanModeReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Thermostat Fan Mode (CC 0x44) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Fan Mode Report. `mode` (low 4 bits): 0 auto low, 1 low,
      2 auto high, 3 high, 4 auto medium, 5 medium, … `off` is bit 7 — a
      separate "fan off" flag carried alongside the mode.
    fields:
      - { name: sourceNodeId, type: u8,   default: 0 }
      - { name: mode,         type: u8,   default: 0 }
      - { name: "off",        type: bool, default: false }

  - name: LogicalThermostatState
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      Aggregated state of a *logical thermostat* (#131/#133) — the climate
      nodes sharing the node-metadata tag `groupKey=groupValue`. Published by
      the ThermostatOrchestrator whenever a member's report changes the
      aggregate. `memberCount` is how many tagged nodes were resolved.
      `mode` / `fanMode` carry `MODE_MIXED` (0xFF) when members disagree;
      `operatingState` is "active" (heating/cooling) if any member is.
      The setpoint fields carry the most-recently-reported member setpoint
      (with its `setpointType` so the client knows which). Aggregation only
      — closed-loop control is a separate future epic.
    constants:
      - { name: MODE_MIXED, value: 0xFF }
    fields:
      - { name: groupKey,          type: string }
      - { name: groupValue,        type: string }
      - { name: memberCount,       type: u8,  default: 0 }
      - { name: mode,              type: u8,  default: 0 }
      - { name: operatingState,    type: u8,  default: 0 }
      - { name: fanMode,           type: u8,  default: 0 }
      - { name: setpointType,      type: u8,  default: 0 }
      - { name: setpointScale,     type: u8,  default: 0 }
      - { name: setpointPrecision, type: u8,  default: 0 }
      - { name: setpointValue,     type: i32, default: 0, doc: "raw; target = value / 10^precision" }

  - name: WakeUpIntervalReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Wake Up (CC 0x84) Interval Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Wake Up Interval Report. `seconds` is the
      node's current wake-up interval (0 means stay-awake / disabled
      for most devices); `controllerNodeId` is the node the sleeper
      will phone home to on wake-up.
    fields:
      - { name: sourceNodeId,     type: u8,  default: 0 }
      - { name: seconds,          type: u32, default: 0 }
      - { name: controllerNodeId, type: u8,  default: 0 }

  - name: WakeUpNotification
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api, orchestrator] }
    doc: |
      A sleeping node is briefly awake. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData is `(0x84, 0x07)`. Consumed by WakeUpOrchestrator (#68)
      to drain any pending commands for `sourceNodeId` and then
      send WAKE_UP_NO_MORE_INFORMATION so the node sleeps again
      ASAP (battery).
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }

  - name: PendingCommandEnqueued
    category: transient
    direction: { publishers: [pending-queue], subscribers: [external-api] }
    doc: |
      A daemon-internal Set/Get for a (typically sleeping) node was
      stashed in the persistent pending-command queue (`nodes.db` →
      `pending_commands` table). Drained on the next
      WAKE_UP_NOTIFICATION by WakeUpOrchestrator (#68). Mostly
      useful for observability — operators can confirm via D-Bus
      that "yes, your Set went somewhere it can be retried."
    constants:
      - { name: PRIORITY_HIGH,   value: 50,  doc: "matches PendingQueue::PRIORITY_HIGH" }
      - { name: PRIORITY_NORMAL, value: 100, doc: "matches PendingQueue::PRIORITY_NORMAL" }
      - { name: PRIORITY_LOW,    value: 200, doc: "matches PendingQueue::PRIORITY_LOW" }
    fields:
      - { name: nodeId,   type: u8,  default: 0 }
      - { name: sequence, type: u32, default: 0, doc: "auto-increment row id; monotonic within a daemon run" }
      - { name: priority, type: u8,  default: PRIORITY_NORMAL }

  - name: PendingCommandsDrained
    category: transient
    direction: { publishers: [pending-queue], subscribers: [external-api] }
    doc: |
      The pending-command queue for `nodeId` was flushed (typically
      by WakeUpOrchestrator after a wake-up). `count` is the number
      of payloads that were actually queued; 0 is a valid value
      and means "the wake-up handler asked but had nothing to send."
    fields:
      - { name: nodeId, type: u8,  default: 0 }
      - { name: count,  type: u32, default: 0 }

  - name: WakeUpCycleComplete
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      WakeUpOrchestrator (#68) finished servicing a wake-up for
      `nodeId`: it drained `drainedCount` pending payloads, dispatched
      each as a SendData, then issued WAKE_UP_NO_MORE_INFORMATION so
      the node could return to sleep. `drainedCount == 0` is normal —
      the node woke, had nothing waiting, and was sent straight back to
      sleep. Distinct from PendingCommandsDrained (which fires when the
      queue is read, before the commands and the sleep nudge are sent);
      this marks the *end* of the whole cycle. Observability only.
    fields:
      - { name: nodeId,       type: u8,  default: 0 }
      - { name: drainedCount, type: u32, default: 0 }

  - name: InclusionLifelineSet
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      InclusionOrchestrator (#67) set node `nodeId`'s lifeline
      (Association group 1 → controller) during post-inclusion setup.
      Progress event for observers (terminal, a future
      SecurityOrchestrator); fire-and-forget, not an ack that the node
      received the SET.
    fields:
      - { name: nodeId, type: u8, default: 0 }

  - name: InclusionPolicyApplied
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      InclusionOrchestrator (#67) finished dispatching the effective
      policy (Configuration parameters / Associations / Wake-Up
      interval) for node `nodeId`. `entriesApplied` is how many policy
      entries were sent (0 means no policy applied to this node).
    fields:
      - { name: nodeId,         type: u8,  default: 0 }
      - { name: entriesApplied, type: u32, default: 0 }

  - name: InclusionComplete
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      InclusionOrchestrator (#67) finished the whole post-inclusion
      sequence for node `nodeId` (lifeline + policy). Always fires once
      per NodeIncluded, even when nothing applied — the terminal marker
      a SecurityOrchestrator (#26/#27) or the terminal can wait on.
    fields:
      - { name: nodeId, type: u8, default: 0 }

  - name: SceneActivated
    category: transient
    direction: { publishers: [orchestrator], subscribers: [external-api] }
    doc: |
      SceneOrchestrator (#121) ran a scene in response to a physical press.
      A CentralSceneNotification `(sourceNodeId, sceneNumber, keyAttribute)`
      resolved to scene `sceneId` in the scene store (#120); the
      orchestrator replayed its `actionCount` actions as SendData commands.
      Observability only (and the hook the terminal renders). Not published
      when a press resolves to no scene.
    fields:
      - { name: sourceNodeId, type: u8,     default: 0 }
      - { name: sceneNumber,  type: u8,     default: 0 }
      - { name: keyAttribute, type: u8,     default: 0 }
      - { name: sceneId,      type: string }
      - { name: actionCount,  type: u32,    default: 0 }

  - name: ConfigurationReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api, orchestrator] }
    doc: |
      Typed Configuration (CC 0x70) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Configuration Report. `value` is the
      sign-extended 32-bit form of the wire bytes — `size` (1, 2,
      or 4) says how many bytes were on the wire and whether the
      caller should reinterpret as unsigned. The Z-Wave spec
      treats configuration values as two's-complement signed by
      convention; callers who know their parameter is unsigned
      can `static_cast<std::uint32_t>(value)`.

      v4 adds Bulk variants (0x07/0x08/0x09); not decoded today.
    fields:
      - { name: sourceNodeId, type: u8,  default: 0 }
      - { name: parameter,    type: u8,  default: 0 }
      - { name: size,         type: u8,  default: 0, doc: "1, 2, or 4" }
      - { name: value,        type: i32, default: 0, doc: "sign-extended from size's MSB" }

  - name: NodeVersionReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Version (CC 0x86) Report from a *node*. Republished by
      the cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Version Report. Carries the node's Z-Wave
      library type, Z-Wave protocol version, and application version
      — distinct from the daemon's own version (see GetVersion).
      Naming: `Node` prefix distinguishes from the daemon's existing
      `Version` namespace; the wire CC is plain "Version".
      libraryType values mirror HostApi::LIBRARY_TYPE_* (1=Static
      Controller, 2=Controller, 3=Enhanced Slave, 4=Slave, …).
      v2 adds hardware version + per-firmware-target list; not
      decoded today.
    fields:
      - { name: sourceNodeId,         type: u8, default: 0 }
      - { name: libraryType,          type: u8, default: 0 }
      - { name: protocolVersion,      type: u8, default: 0 }
      - { name: protocolSubVersion,   type: u8, default: 0 }
      - { name: applicationVersion,   type: u8, default: 0 }
      - { name: applicationSubVersion, type: u8, default: 0 }

  - name: ZWavePlusInfoReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Z-Wave Plus Info (CC 0x5E) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Z-Wave Plus Info Report. Identifies how a
      Z-Wave Plus node positions itself in the network (role / node
      type) and which device-database icons it advertises.
      Role-type values (per the Z-Wave Plus role-type spec):
        0x00 CENTRAL_STATIC_CONTROLLER
        0x01 SUB_STATIC_CONTROLLER
        0x02 PORTABLE_CONTROLLER
        0x03 PORTABLE_REPORTING_CONTROLLER
        0x04 PORTABLE_SLAVE
        0x05 ALWAYS_ON_SLAVE
        0x06 SLEEPING_REPORTING_SLAVE
        0x07 SLEEPING_LISTENING_SLAVE
      Node-type values:
        0x00 ZWAVEPLUS_NODE
        0x02 ZWAVEPLUS_IP_GATEWAY
    fields:
      - { name: sourceNodeId,      type: u8,  default: 0 }
      - { name: zwavePlusVersion,  type: u8,  default: 0 }
      - { name: roleType,          type: u8,  default: 0 }
      - { name: nodeType,          type: u8,  default: 0 }
      - { name: installerIconType, type: u16, default: 0 }
      - { name: userIconType,      type: u16, default: 0 }

  - name: ManufacturerSpecificReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Manufacturer Specific (CC 0x72) Report. Republished by
      the cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Manufacturer Specific Report. The three
      u16 identifiers come from the Z-Wave alliance assignment list
      and together pin down which physical device this node is.
    fields:
      - { name: sourceNodeId,   type: u8,  default: 0 }
      - { name: manufacturerId, type: u16, default: 0 }
      - { name: productTypeId,  type: u16, default: 0 }
      - { name: productId,      type: u16, default: 0 }

  - name: MultilevelSwitchReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Multilevel Switch (CC 0x26) Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose
      ccData parses as a Multilevel Switch Report. v1 wire form
      carries only currentValue (targetValue mirrors current,
      wireFormatV2 = false); v2+ carries the full transition triple.
      Value byte semantics:
        0x00       = off / level 0
        0x01..0x63 = level 1..99
        0xFE       = unknown (Report-only)
        0xFF       = on / "restore last level" (Set-only)
      Duration byte:
        0x00       = instant
        0x01..0x7F = seconds
        0x80..0xFE = minutes (count = byte - 0x7F)
        0xFF       = factory default duration
    fields:
      - { name: sourceNodeId, type: u8,   default: 0 }
      - { name: currentValue, type: u8,   default: 0 }
      - { name: targetValue,  type: u8,   default: 0 }
      - { name: duration,     type: u8,   default: 0 }
      - { name: wireFormatV2, type: bool, default: false }

  - name: ColorSwitchReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Color Switch (CC 0x33) Report — the level of one colour
      component. Republished by the cc-translator from inbound
      ApplicationCommand frames whose ccData parses as a Color Switch
      Report. componentId: 0 warm white, 1 cold white, 2 red, 3 green,
      4 blue, 5 amber, 6 cyan, 7 purple. v1 reports carry only `value`
      (targetValue mirrors it, duration 0); v3+ adds the transition
      target + duration.
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: componentId,  type: u8, default: 0 }
      - { name: value,        type: u8, default: 0 }
      - { name: targetValue,  type: u8, default: 0 }
      - { name: duration,     type: u8, default: 0 }

  - name: CentralSceneNotification
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Central Scene (CC 0x5B) Notification — a physical button press
      on a remote or wall switch. Push-only: the daemon never sends these,
      it only republishes inbound ApplicationCommand frames whose ccData
      parses as a Central Scene Notification. `keyAttribute`: 0 press 1×,
      1 release, 2 hold, 3 press 2×, 4 press 3×, 5 press 4×, 6 press 5×.
      `sequenceNumber` is a rolling counter for de-duplication.
    fields:
      - { name: sourceNodeId,   type: u8,   default: 0 }
      - { name: sequenceNumber, type: u8,   default: 0 }
      - { name: keyAttribute,   type: u8,   default: 0 }
      - { name: sceneNumber,    type: u8,   default: 0 }
      - { name: slowRefresh,    type: bool, default: false }

  - name: BasicSetReceived
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api, orchestrator] }
    doc: |
      A node sent us a Basic (CC 0x20) Set — the way many non-scene
      controllers (PIR sensors, simple wall switches) address their
      association target. Push-only: republished by the cc-translator from
      inbound ApplicationCommand frames whose ccData parses as a Basic Set.
      `value`: 0x00 off/inactive, 0xFF on/active, 0x01..0x63 a level. The
      SceneOrchestrator (#124) keys scene triggers on (sourceNodeId, value).
    fields:
      - { name: sourceNodeId, type: u8, default: 0 }
      - { name: value,        type: u8, default: 0 }

  - name: SceneActivationSet
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api, orchestrator] }
    doc: |
      A node sent us a Scene Activation (CC 0x2B) Set — a scene controller
      announcing "scene N is now active". Push-only: republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Scene Activation Set. `sceneId` is the activated scene
      number (1..255); `dimmingDuration` is the requested transition time
      (0x00 instant, 0x01..0x7F seconds, 0x80..0xFE minutes, 0xFF default).
      The SceneOrchestrator (#124) keys scene triggers on (sourceNodeId,
      sceneId).
    fields:
      - { name: sourceNodeId,    type: u8, default: 0 }
      - { name: sceneId,         type: u8, default: 0 }
      - { name: dimmingDuration, type: u8, default: 0 }

  - name: DoorLockOperationReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed Door Lock (CC 0x62) Operation Report. Republished by the
      cc-translator from inbound ApplicationCommand frames whose ccData
      parses as a Door Lock Operation Report. currentMode: 0x00 unsecured,
      0x01 unsecured w/ timeout, 0x10 inside-handles, 0x11 inside-handles w/
      timeout, 0xFF secured. v4+ adds targetMode + duration (0 otherwise).
    fields:
      - { name: sourceNodeId,       type: u8, default: 0 }
      - { name: currentMode,        type: u8, default: 0 }
      - { name: handlesMode,        type: u8, default: 0 }
      - { name: condition,          type: u8, default: 0 }
      - { name: lockTimeoutMinutes, type: u8, default: 0 }
      - { name: lockTimeoutSeconds, type: u8, default: 0 }
      - { name: targetMode,         type: u8, default: 0 }
      - { name: duration,           type: u8, default: 0 }

  - name: UserCodeReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: |
      Typed User Code (CC 0x63) Report for one slot. userIdStatus: 0x00
      available (no code), 0x01 enabled/occupied, 0xFE not-available. The
      userCode is the raw 4–10 ASCII digits (empty when the slot is free).
    fields:
      - { name: sourceNodeId,   type: u8,    default: 0 }
      - { name: userIdentifier, type: u8,    default: 0 }
      - { name: userIdStatus,   type: u8,    default: 0 }
      - { name: userCode,       type: bytes }

  - name: UserCodeUsersNumberReport
    category: transient
    direction: { publishers: [cc-translator], subscribers: [external-api] }
    doc: Typed User Code (CC 0x63) Users-Number Report — how many code slots the lock has.
    fields:
      - { name: sourceNodeId,   type: u8, default: 0 }
      - { name: supportedUsers, type: u8, default: 0 }

  # ---- 2d. Command events (D-Bus → ProtocolThread) ----------------
  # External transports translate semantic D-Bus calls into one of
  # these and publish; ProtocolThread subscribes and dispatches.

  - name: AddNodeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Initiate or stop FUNC_ID_ZW_ADD_NODE_TO_NETWORK (0x4A).
    constants:
      - { name: MODE_ANY_NODE,            value: 0x01 }
      - { name: MODE_STOP,                value: 0x05 }
      - { name: MODE_STOP_REPLICATION,    value: 0x06 }
      - { name: MODE_SMART_START_INCLUDE, value: 0x08 }
      - { name: MODE_SMART_START_LISTEN,  value: 0x09 }
    fields:
      - { name: mode,              type: u8,             default: MODE_ANY_NODE }
      - { name: power,             type: bool,           default: false }
      - { name: nwi,               type: bool,           default: false }
      - { name: protocolLongRange, type: bool,           default: false }
      - { name: skipFlNeighbors,   type: bool,           default: false }
      - { name: sessionId,         type: u8,             default: 0 }
      - { name: includeHomeIds,    type: bool,           default: false }
      - { name: nwiHomeId,         type: "array<u8, 4>" }
      - { name: authHomeId,        type: "array<u8, 4>" }

  - name: RemoveNodeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Initiate or stop FUNC_ID_ZW_REMOVE_NODE_FROM_NETWORK (0x4B).
    constants:
      - { name: MODE_ANY_NODE, value: 0x01 }
      - { name: MODE_STOP,     value: 0x05 }
    fields:
      - { name: mode,      type: u8,   default: MODE_ANY_NODE }
      - { name: power,     type: bool, default: false }
      - { name: nwe,       type: bool, default: false }
      - { name: sessionId, type: u8,   default: 0 }

  - name: RemoveFailedNodeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Drive FUNC_ID_ZW_REMOVE_FAILED_NODE_ID (0x61) for an unresponsive node.
    fields:
      - { name: nodeId,    type: u8, default: 0 }
      - { name: sessionId, type: u8, default: 0 }

  - name: RequestNodeInfoCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Drive FUNC_ID_ZW_REQUEST_NODE_INFO (0x60) — asks the dongle to
      ferry a NodeInfo request to the target node. Synchronous result
      comes back as RequestNodeInfoStatus; the actual NodeInfo (when /
      if the node answers) arrives as NodeInfoUpdate, possibly never
      for sleeping nodes.
    fields:
      - { name: nodeId,    type: u8, default: 0 }
      - { name: sessionId, type: u8, default: 0 }

  - name: SetSwitchBinaryCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Drive a node's Binary Switch (CC 0x25) on/off state.
    fields:
      - { name: nodeId,     type: u8,   default: 0 }
      - { name: turnOn,     type: bool, default: false }
      - { name: callbackId, type: u8,   default: 0 }

  - name: GetSwitchBinaryCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Binary Switch state.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetIndicatorCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: "Set a node's Indicator (CC 0x87) value (0 off, 1..99 level, 0xFF on)."
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: value,      type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetIndicatorCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Indicator value.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SendSupervisedCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send an arbitrary CC frame to a node wrapped in Supervision (CC 0x6C)
      GET, so the node returns a SupervisionReport distinguishing
      transmitted from applied. `sessionId` is a caller-chosen 6-bit nonce
      the node echoes in its report, so the caller correlates without a
      daemon-side session table (#14 MVP). `ccData` is the raw inner CC
      frame (class + cmd + params).
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: sessionId,  type: u8,    default: 0 }
      - { name: ccData,     type: bytes }
      - { name: callbackId, type: u8,    default: 0 }

  - name: SendDataToEndpointCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send an arbitrary CC frame to a specific Multi Channel endpoint on a
      node (#13). The daemon wraps `ccData` in a MULTI_CHANNEL_CMD_ENCAP
      addressed from the controller root (source endpoint 0) to
      `endpoint`. Lets the daemon drive the (nodeId, endpoint) members it
      can already configure via Multi Channel Association (CC 0x8E).
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: endpoint,   type: u8,    default: 0 }
      - { name: ccData,     type: bytes }
      - { name: callbackId, type: u8,    default: 0 }

  - name: GetMultiChannelEndpointsCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query how many Multi Channel endpoints a node presents (CC 0x60 END_POINT_GET).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetMultiChannelCapabilityCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query one Multi Channel endpoint's device class + CC list (CC 0x60 CAPABILITY_GET).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: endpoint,   type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetBasicCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send a Basic (CC 0x20) Set. Spec semantics:
      0=off, 0x01..0x63=level 1..99, 0xFF=on/full/"previous level".
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: value,      type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetMultilevelSwitchCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send a Multilevel Switch (CC 0x26) Set. Value semantics:
      0x00 off, 0x01..0x63 level 1..99, 0xFF "restore last level".
      Duration byte: 0x00 instant, 0x01..0x7F seconds,
      0x80..0xFE minutes (count = byte - 0x7F), 0xFF factory default.
      The daemon always emits the v2 wire form (value + duration);
      v1-only devices ignore the trailing duration byte per spec.
    constants:
      - { name: DURATION_DEFAULT, value: 0xFF }
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: value,      type: u8, default: 0 }
      - { name: duration,   type: u8, default: DURATION_DEFAULT }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetMultilevelSwitchCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Multilevel Switch value.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetDoorLockCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: "Send a Door Lock (CC 0x62) Operation Set. mode: 0x00 unsecured, 0xFF secured, …"
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: mode,       type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetDoorLockCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Door Lock operation state.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetUserCodeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send a User Code (CC 0x63) Set for one slot. `userCode` is the raw
      4–10 ASCII digits; `userIdStatus` 0x00 available (clears the slot),
      0x01 enabled/occupied.
    fields:
      - { name: nodeId,         type: u8,    default: 0 }
      - { name: userIdentifier, type: u8,    default: 0 }
      - { name: userIdStatus,   type: u8,    default: 0 }
      - { name: userCode,       type: bytes }
      - { name: callbackId,     type: u8,    default: 0 }

  - name: GetUserCodeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query one User Code slot.
    fields:
      - { name: nodeId,         type: u8, default: 0 }
      - { name: userIdentifier, type: u8, default: 0 }
      - { name: callbackId,     type: u8, default: 0 }

  - name: GetUserCodeCountCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query how many User Code slots a lock supports (USERS_NUMBER_GET).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetColorSwitchCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Send a Color Switch (CC 0x33) Set. `components` is a flat byte blob of
      alternating (componentId, value) pairs — e.g. {2,255, 3,0, 4,0} sets
      red full, green/blue off. `duration` uses the standard transition
      encoding (0 instant, 1..0x7F seconds, 0x80..0xFE minutes, 0xFF default).
    constants:
      - { name: DURATION_DEFAULT, value: 0xFF }
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: components, type: bytes, doc: "alternating (componentId, value) pairs" }
      - { name: duration,   type: u8,    default: DURATION_DEFAULT }
      - { name: callbackId, type: u8,    default: 0 }

  - name: GetColorSwitchCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query one colour component's level (componentId 0..7).
    fields:
      - { name: nodeId,      type: u8, default: 0 }
      - { name: componentId, type: u8, default: 0 }
      - { name: callbackId,  type: u8, default: 0 }

  - name: GetSensorMultilevelCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's primary multilevel sensor (v1 Get, no type filter).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetSensorBinaryCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's binary sensor state (v1 Get, no type filter).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetNotificationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's notification status for a given notificationType (v3 Get).
    fields:
      - { name: nodeId,           type: u8, default: 0 }
      - { name: notificationType, type: u8, default: 0 }
      - { name: callbackId,       type: u8, default: 0 }

  - name: GetMeterCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's meter reading for a given scale (v2+ Get; scale 0..3).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: scale,      type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetThermostatModeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: "Set a node's thermostat mode (0 off, 1 heat, 2 cool, 3 auto, …)."
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: mode,       type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetThermostatModeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's current thermostat mode.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetThermostatSetpointCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: "Set a node's thermostat setpoint (target temperature) for a setpoint type."
    fields:
      - { name: nodeId,       type: u8,  default: 0 }
      - { name: setpointType, type: u8,  default: 0 }
      - { name: precision,    type: u8,  default: 0 }
      - { name: scale,        type: u8,  default: 0 }
      - { name: value,        type: i32, default: 0, doc: "raw; target = value / 10^precision" }
      - { name: callbackId,   type: u8,  default: 0 }

  - name: GetThermostatSetpointCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's thermostat setpoint for a given setpoint type.
    fields:
      - { name: nodeId,       type: u8, default: 0 }
      - { name: setpointType, type: u8, default: 0 }
      - { name: callbackId,   type: u8, default: 0 }

  - name: GetThermostatOperatingStateCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's current thermostat operating state (read-only CC).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetThermostatFanModeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: "Set a node's thermostat fan mode (0 auto low, 1 low, 2 auto high, …); off flag turns the fan off."
    fields:
      - { name: nodeId,     type: u8,   default: 0 }
      - { name: mode,       type: u8,   default: 0 }
      - { name: "off",      type: bool, default: false }
      - { name: callbackId, type: u8,   default: 0 }

  - name: GetThermostatFanModeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's current thermostat fan mode.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: LogicalThermostatModeCommand
    category: command
    direction: { publishers: [external-api], subscribers: [orchestrator] }
    doc: |
      Set the thermostat mode of a *logical thermostat* (#131/#133) — every
      climate node tagged `groupKey=groupValue` that supports Thermostat Mode
      (CC 0x40). The ThermostatOrchestrator fans this out to one
      SetThermostatModeCommand per resolved member.
    fields:
      - { name: groupKey,   type: string }
      - { name: groupValue, type: string }
      - { name: mode,       type: u8, default: 0 }

  - name: LogicalThermostatSetpointCommand
    category: command
    direction: { publishers: [external-api], subscribers: [orchestrator] }
    doc: |
      Set the setpoint of a *logical thermostat* (#131/#133) — every climate
      node tagged `groupKey=groupValue` that supports Thermostat Setpoint
      (CC 0x43). The ThermostatOrchestrator fans this out to one
      SetThermostatSetpointCommand per resolved member. Raw precision/scale/
      value encoding, same as the per-node command.
    fields:
      - { name: groupKey,     type: string }
      - { name: groupValue,   type: string }
      - { name: setpointType, type: u8,  default: 0 }
      - { name: precision,    type: u8,  default: 0 }
      - { name: scale,        type: u8,  default: 0 }
      - { name: value,        type: i32, default: 0, doc: "raw; target = value / 10^precision" }

  - name: GetBatteryCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Battery level.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetManufacturerSpecificCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's manufacturer / product identifiers.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetZWavePlusInfoCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Z-Wave Plus role / node type and icon advertisements.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetNodeVersionCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: |
      Query a node's Version CC (0x86) Report — node firmware versions.
      Distinct from the daemon's GetVersion D-Bus method (which
      returns the daemon's own semver / git-describe).
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetConfigurationCommand
    category: command
    direction: { publishers: [external-api, orchestrator], subscribers: [zwave-protocol] }
    doc: |
      Send Configuration Set (CC 0x70) to a node. `size` must be 1,
      2, or 4; the encoder truncates `value` to the low `size` bytes
      big-endian (so a -1 / 0xFFFFFFFF in size=1 becomes 0xFF on the
      wire). `signed` is advisory metadata for the policy register
      (#66) and downstream tooling — it does not change the encoded
      bytes. Published by InclusionOrchestrator (#67) with one
      publish per parameter in the resolved per-device policy.
    fields:
      - { name: nodeId,     type: u8,   default: 0 }
      - { name: parameter,  type: u8,   default: 0 }
      - { name: size,       type: u8,   default: 1, doc: "1, 2, or 4" }
      - { name: isSigned,   type: bool, default: false, doc: "advisory; doesn't affect encoded bytes (`signed` is a C++ keyword)" }
      - { name: value,      type: i32,  default: 0 }
      - { name: callbackId, type: u8,   default: 0 }

  - name: GetConfigurationCommand
    category: command
    direction: { publishers: [external-api, orchestrator], subscribers: [zwave-protocol] }
    doc: Query a single Configuration parameter from a node.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: parameter,  type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetWakeUpIntervalCommand
    category: command
    direction: { publishers: [external-api, orchestrator], subscribers: [zwave-protocol] }
    doc: |
      Send Wake Up Interval Set (CC 0x84) to a node. `seconds` is the
      24-bit unsigned interval the spec allows; values above
      0x00FFFFFF are clamped at encode time. `controllerNodeId` is
      the node the sleeper will phone home to — usually the daemon's
      own controller node ID. Published by InclusionOrchestrator
      (#67) when applying the per-device wake-up policy.
    fields:
      - { name: nodeId,           type: u8,  default: 0 }
      - { name: seconds,          type: u32, default: 0 }
      - { name: controllerNodeId, type: u8,  default: 0 }
      - { name: callbackId,       type: u8,  default: 0 }

  - name: GetWakeUpIntervalCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's current Wake Up interval.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SendWakeUpNoMoreInformationCommand
    category: command
    direction: { publishers: [orchestrator, external-api], subscribers: [zwave-protocol] }
    doc: |
      Send WAKE_UP_NO_MORE_INFORMATION (CC 0x84 cmd 0x08) to a
      node, telling it to go back to sleep ASAP. Published by
      WakeUpOrchestrator (#68) after draining the pending queue;
      also exposed on D-Bus for diagnostics.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SendDataCommand
    category: command
    direction: { publishers: [orchestrator], subscribers: [zwave-protocol] }
    doc: |
      Send a pre-encoded application-command payload to a node. Unlike
      the per-CC command events, this carries the raw Command Class
      bytes verbatim in `payload` — used by WakeUpOrchestrator (#68) to
      replay entries drained from the persistent pending-command queue,
      which stores opaque encoded bytes rather than typed commands.
      ProtocolThread wraps `payload` in a FUNC_ID_ZW_SEND_DATA envelope
      addressed to `nodeId`. Internal conduit only — not exposed on
      D-Bus (external clients enqueue indirectly via the typed Set/Get
      methods).
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: payload,    type: bytes }
      - { name: callbackId, type: u8,    default: 0 }

  - name: GetBasicCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Query a node's Basic value.
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetAssociationCommand
    category: command
    direction: { publishers: [external-api, orchestrator], subscribers: [zwave-protocol] }
    doc: Add members to a group on the Association CC (0x85).
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: groupId,    type: u8,    default: 0 }
      - { name: members,    type: bytes }
      - { name: callbackId, type: u8,    default: 0 }

  - name: RemoveAssociationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Remove members from a group (empty members = remove all).
    fields:
      - { name: nodeId,     type: u8,    default: 0 }
      - { name: groupId,    type: u8,    default: 0 }
      - { name: members,    type: bytes }
      - { name: callbackId, type: u8,    default: 0 }

  - name: GetAssociationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: groupId,    type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetAssociationGroupingsCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: SetMultichannelAssociationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    doc: Multi Channel Association (CC 0x8E) with both whole-node and (node,endpoint) members.
    fields:
      - { name: nodeId,          type: u8,                    default: 0 }
      - { name: groupId,         type: u8,                    default: 0 }
      - { name: nodeMembers,     type: bytes }
      - { name: endpointMembers, type: list<EndpointMember> }
      - { name: callbackId,      type: u8,                    default: 0 }

  - name: RemoveMultichannelAssociationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    fields:
      - { name: nodeId,          type: u8,                    default: 0 }
      - { name: groupId,         type: u8,                    default: 0 }
      - { name: nodeMembers,     type: bytes }
      - { name: endpointMembers, type: list<EndpointMember> }
      - { name: callbackId,      type: u8,                    default: 0 }

  - name: GetMultichannelAssociationCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: groupId,    type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

  - name: GetMultichannelAssociationGroupingsCommand
    category: command
    direction: { publishers: [external-api], subscribers: [zwave-protocol] }
    fields:
      - { name: nodeId,     type: u8, default: 0 }
      - { name: callbackId, type: u8, default: 0 }

# =====================================================================
# 3. D-Bus surface
# =====================================================================
# The system-bus contract published by ExternalApi::DBusBackend.

dbus:
  bus_name:    com.tiunda.ZWaved
  object_path: /com/tiunda/ZWaved
  interface:   com.tiunda.ZWaved1

  # ---- 3a. Methods ------------------------------------------------
  # `action` describes what the method does. Three shapes:
  #
  #   publish: <EventName>
  #     Take the inbound D-Bus arguments and publish them as the
  #     given MessageBus command event. Field mapping is by name
  #     unless `map:` is given. Return type is void (no out args).
  #
  #   publish_constant: { event: <Event>, fields: {<f>: <value>} }
  #     Publish a fixed shape (e.g. StopAddNode → AddNodeCommand
  #     with mode=MODE_STOP). Inbound D-Bus args fill any missing
  #     fields; everything else is the constant.
  #
  #   read_cached: <EventName>
  #     Return the latest retained value of the given state event.
  #     The struct shape comes from `returns:`.
  #
  #   custom: <name>
  #     Hand-written body. Codegen emits a forward declaration the
  #     daemon implements; bookkeeping fields below describe the
  #     return shape so the manifest still documents the contract.

  methods:

    # -- Inclusion / exclusion -------------------------------------
    - name: AddNode
      params:
        - { name: mode,       dbus: y, cpp: u8 }
        - { name: flags,      dbus: y, cpp: u8, doc: "bit 7=Power, 6=NWI, 5=Protocol, 4=SFLND" }
        - { name: sessionId,  dbus: y, cpp: u8 }
        - { name: nwiHomeId,  dbus: ay, cpp: bytes }
        - { name: authHomeId, dbus: ay, cpp: bytes }
      # Custom: the flags byte unpacks into four bool fields on
      # AddNodeCommand (power / nwi / protocolLongRange /
      # skipFlNeighbors), and the home-ID arrays are converted from
      # vector<u8> into array<u8, 4> with an `includeHomeIds`
      # computed flag — none of which the codegen expresses today.
      action:
        custom: emitAddNode

    - name: StopAddNode
      params:
        - { name: sessionId, dbus: y, cpp: u8 }
      action:
        publish_constant:
          event: AddNodeCommand
          fields: { mode: MODE_STOP }

    - name: RemoveNode
      params:
        - { name: mode,      dbus: y, cpp: u8 }
        - { name: flags,     dbus: y, cpp: u8, doc: "bit 7=Power, 6=NWE" }
        - { name: sessionId, dbus: y, cpp: u8 }
      # Custom: same flag-byte-unpack reason as AddNode.
      action:
        custom: emitRemoveNode

    - name: StopRemoveNode
      params:
        - { name: sessionId, dbus: y, cpp: u8 }
      action:
        publish_constant:
          event: RemoveNodeCommand
          fields: { mode: MODE_STOP }

    - name: RemoveFailedNode
      params:
        - { name: nodeId,    dbus: y, cpp: u8 }
        - { name: sessionId, dbus: y, cpp: u8 }
      action:
        publish: RemoveFailedNodeCommand

    - name: RequestNodeInfo
      params:
        - { name: nodeId,    dbus: y, cpp: u8 }
        - { name: sessionId, dbus: y, cpp: u8 }
      action:
        publish: RequestNodeInfoCommand

    # -- Application CCs -------------------------------------------
    - name: SetSwitchBinary
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
        - { name: turnOn,     dbus: b, cpp: bool }
        - { name: callbackId, dbus: y, cpp: u8 }
      action:
        publish: SetSwitchBinaryCommand

    - name: GetSwitchBinary
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
        - { name: callbackId, dbus: y, cpp: u8 }
      action:
        publish: GetSwitchBinaryCommand

    - name: SetIndicator
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
        - { name: value,      dbus: y, cpp: u8 }
        - { name: callbackId, dbus: y, cpp: u8 }
      action:
        publish: SetIndicatorCommand

    - name: GetIndicator
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
        - { name: callbackId, dbus: y, cpp: u8 }
      action:
        publish: GetIndicatorCommand

    - name: SendSupervised
      params:
        - { name: nodeId,     dbus: y,  cpp: u8 }
        - { name: sessionId,  dbus: y,  cpp: u8 }
        - { name: ccData,     dbus: ay, cpp: bytes }
        - { name: callbackId, dbus: y,  cpp: u8 }
      action:
        publish: SendSupervisedCommand

    - name: SendDataToEndpoint
      params:
        - { name: nodeId,     dbus: y,  cpp: u8 }
        - { name: endpoint,   dbus: y,  cpp: u8 }
        - { name: ccData,     dbus: ay, cpp: bytes }
        - { name: callbackId, dbus: y,  cpp: u8 }
      action:
        publish: SendDataToEndpointCommand

    - name: GetMultiChannelEndpoints
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
        - { name: callbackId, dbus: y, cpp: u8 }
      action:
        publish: GetMultiChannelEndpointsCommand

    - name: GetMultiChannelCapability
      params:
        - { name: nodeId,     dbus: y, cpp: u8 }
