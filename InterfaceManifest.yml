    # -- Cached-state queries --------------------------------------
    # `read_cached:` is documented as a first-class action in the
    # manifest, but the codegen treats these as `custom:` for now —
    # generating the per-event tuple construction and lock-and-copy
    # body needs richer type-system support and a convention for
    # how the daemon caches each event (whole-event vs. just the
    # `.nodes` field for NodeListChanged). Phase 3.5.
    - name: GetNodes
      params: []
      returns:
        type: list<NodeInfo>
        dbus: a(yyyyay)
      action:
        custom: emitGetNodes

    - name: GetDongleInfo
      params: []
      returns:
        struct:
          - { name: libraryVersion,   dbus: s,  cpp: string }
          - { name: libraryType,      dbus: y,  cpp: u8 }
          - { name: homeId,           dbus: ay, cpp: bytes }
          - { name: controllerNodeId, dbus: y,  cpp: u8 }
      action:
        custom: emitGetDongleInfo

    - name: GetInitData
      params: []
      returns:
        struct:
          - { name: serialApiVersion, dbus: y,  cpp: u8 }
          - { name: capabilities,     dbus: y,  cpp: u8 }
          - { name: nodeIds,          dbus: ay, cpp: bytes }
          - { name: chipType,         dbus: y,  cpp: u8 }
          - { name: chipVersion,      dbus: y,  cpp: u8 }
      action:
        custom: emitGetInitData

    # -- Custom (hand-written) -------------------------------------
    - name: GetVersion
      params: []
      returns:
        struct:
          - { name: semver,      dbus: s, source: Version::SEMVER }
          - { name: gitDescribe, dbus: s, source: Version::GIT_DESCRIBE }
      action:
        custom: emitGetVersion

    - name: GetNetworkStatus
      doc: |
        Aggregate snapshot drawing on multiple cached events
        (DongleStatus + DongleInfo + NodeListChanged + SessionStatus)
        plus daemon uptime. Hand-written today; a richer mapping
        notation could express it declaratively, but the surface is
        small enough that codegen for it isn't load-bearing.
      params: []
      returns:
        struct:
          - { name: dongleConnected,  dbus: b, source: cached.DongleStatus.connected }
          - { name: ttyPath,          dbus: s, source: cached.DongleStatus.ttyPath }
          - { name: homeId,           dbus: s, source: "hex(cached.DongleInfo.homeId)" }
          - { name: controllerNodeId, dbus: y, source: cached.DongleInfo.controllerNodeId }
          - { name: nodeCount,        dbus: u, source: "cached.NodeListChanged.nodes.size()" }
          - { name: sessionActive,    dbus: b, source: cached.SessionStatus.active }
          - { name: sessionCommandId, dbus: y, source: cached.SessionStatus.commandId }
          - { name: sessionId,        dbus: y, source: cached.SessionStatus.sessionId }
          - { name: uptimeSeconds,    dbus: t, source: "now() - startTime" }
      action:
        custom: emitGetNetworkStatus

    - name: GetDaemonError
      params: []
      returns:
        struct:
          - { name: severity, dbus: y, source: cached.DaemonError.severity }
          - { name: source,   dbus: s, source: cached.DaemonError.source }
          - { name: code,     dbus: y, source: cached.DaemonError.code }
          - { name: message,  dbus: s, source: cached.DaemonError.message }
      action:
        custom: emitGetDaemonError

    # ---- Policy CRUD (#69) ----------------------------------------
    # Read/write the PolicyRegister (#66) over D-Bus. `policy` is the
    # register's hand-rolled length-prefixed BLOB (see PolicyRegister
    # serialize/deserialize) — clients build it the same way. Each
    # Set/Delete publishes PolicyChanged so the orchestrators
    # re-evaluate. All custom: handlers call PolicyRegister::instance()
    # directly (state read/write, not a bus command).

    - name: SetDevicePolicy
      params:
        - { name: manufacturerId, dbus: q,  cpp: u16 }
        - { name: productTypeId,  dbus: q,  cpp: u16 }
        - { name: productId,      dbus: q,  cpp: u16 }
        - { name: policy,         dbus: ay, cpp: bytes }
      action:
        custom: emitSetDevicePolicy

    - name: GetDevicePolicy
      params:
        - { name: manufacturerId, dbus: q, cpp: u16 }
        - { name: productTypeId,  dbus: q, cpp: u16 }
        - { name: productId,      dbus: q, cpp: u16 }
      returns:
        type: bytes
        dbus: ay
      action:
        custom: emitGetDevicePolicy

    - name: DeleteDevicePolicy
      params:
        - { name: manufacturerId, dbus: q, cpp: u16 }
        - { name: productTypeId,  dbus: q, cpp: u16 }
        - { name: productId,      dbus: q, cpp: u16 }
      action:
        custom: emitDeleteDevicePolicy

    - name: ListDevicePolicies
      params: []
      returns:
        type: list<DevicePolicyEntry>
        dbus: a(qqqay)
      action:
        custom: emitListDevicePolicies

    - name: SetNodeOverride
      params:
        - { name: nodeId, dbus: y,  cpp: u8 }
        - { name: policy, dbus: ay, cpp: bytes }
      action:
        custom: emitSetNodeOverride

    - name: GetNodeOverride
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
      returns:
        type: bytes
        dbus: ay
      action:
        custom: emitGetNodeOverride

    - name: DeleteNodeOverride
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
      action:
        custom: emitDeleteNodeOverride

    - name: GetEffectivePolicy
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
      returns:
        type: bytes
        dbus: ay
      action:
        custom: emitGetEffectivePolicy

    # ---- Node metadata CRUD (#83) ---------------------------------
    # Human-authored descriptive key/value per node. Set with an empty
    # value clears the key. Custom: handlers call NodeMetadata::instance().

    - name: SetNodeMetadata
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
        - { name: key,    dbus: s, cpp: string }
        - { name: value,  dbus: s, cpp: string }
      action:
        custom: emitSetNodeMetadata

    - name: GetNodeMetadata
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
      returns:
        type: list<MetadataEntry>
        dbus: a(ss)
      action:
        custom: emitGetNodeMetadata

    - name: DeleteNodeMetadata
      params:
        - { name: nodeId, dbus: y, cpp: u8 }
        - { name: key,    dbus: s, cpp: string }
      action:
        custom: emitDeleteNodeMetadata

    # Reverse lookup (#132): nodes carrying the exact tag key=value. The
    # membership resolver for the logical thermostat (#131) — "which nodes
    # are tagged room=living-room". Returns the node ids as a byte array.
    - name: GetNodesByMetadata
      params:
        - { name: key,   dbus: s, cpp: string }
        - { name: value, dbus: s, cpp: string }
      returns:
        type: bytes
        dbus: ay
      action:
        custom: emitGetNodesByMetadata

    # ---- Scene + trigger CRUD (#122) ------------------------------
    # Read/write the durable scene store (#120) over D-Bus. A *scene*
    # crosses the wire as a(yay) — an ordered list of
    # (targetNodeId, ccPayload) actions; a *trigger* as a(yyys) —
    # (sourceNodeId, sceneNumber, keyAttribute, sceneId). The
    # SceneOrchestrator (#121) consumes both at runtime; these methods
    # only persist them, so the custom: handlers call
    # SceneStore::instance() directly (state read/write, no bus command).

    - name: SetScene
      params:
        - { name: sceneId, dbus: s,       cpp: string }
        - { name: actions, dbus: "a(yay)", cpp: "list<SceneActionEntry>" }
      # Custom: the actions a(yay) inbound array converts element-wise
      # from sdbus::Struct<u8, ay> to SceneStore::Action.
      action:
        custom: emitSetScene

    - name: GetScene
      params:
        - { name: sceneId, dbus: s, cpp: string }
      returns:
        type: list<SceneActionEntry>
        dbus: a(yay)
      action:
        custom: emitGetScene

    - name: DeleteScene
      params:
        - { name: sceneId, dbus: s, cpp: string }
      action:
        custom: emitDeleteScene

    - name: ListScenes
      params: []
      returns:
        type: list<string>
        dbus: as
      action:
        custom: emitListScenes

    # `source` discriminates the trigger source CC so the same
    # (node, selector) can't collide across sources: 0 Central Scene
    # (selector = sceneNumber, keyAttribute meaningful), 1 Basic Set
    # (selector = value, keyAttribute 0), 2 Scene Activation
    # (selector = sceneId, keyAttribute 0). See #124 / MANUAL §16d.
    - name: BindSceneTrigger
      params:
        - { name: source,       dbus: y, cpp: u8, doc: "0 Central Scene, 1 Basic Set, 2 Scene Activation" }
        - { name: sourceNodeId, dbus: y, cpp: u8 }
        - { name: sceneNumber,  dbus: y, cpp: u8, doc: "selector: scene/value/sceneId per source" }
        - { name: keyAttribute, dbus: y, cpp: u8, doc: "Central Scene key attribute; 0 for other sources" }
        - { name: sceneId,      dbus: s, cpp: string }
      action:
        custom: emitBindSceneTrigger

    - name: UnbindSceneTrigger
      params:
        - { name: source,       dbus: y, cpp: u8 }
        - { name: sourceNodeId, dbus: y, cpp: u8 }
        - { name: sceneNumber,  dbus: y, cpp: u8 }
        - { name: keyAttribute, dbus: y, cpp: u8 }
      action:
        custom: emitUnbindSceneTrigger

    - name: ListSceneTriggers
      params: []
      returns:
        type: list<SceneTriggerEntry>
        dbus: a(yyyys)
      action:
        custom: emitListSceneTriggers

    # ---- Logical thermostat (#131/#134) ---------------------------
    # Drive and read a *logical thermostat* — the climate nodes sharing
    # the node-metadata tag groupKey=groupValue (#83/#132). The Set
    # methods publish the command events the ThermostatOrchestrator
    # (#133) fans out; GetLogicalThermostatState reads the backend's
    # per-group cache of the LogicalThermostatState event (zeros if the
    # group hasn't been addressed and reported yet).
    - name: SetLogicalThermostatMode
      params:
        - { name: groupKey,   dbus: s, cpp: string }
        - { name: groupValue, dbus: s, cpp: string }
        - { name: mode,       dbus: y, cpp: u8 }
      action:
        custom: emitSetLogicalThermostatMode

    - name: SetLogicalThermostatSetpoint
      params:
        - { name: groupKey,     dbus: s, cpp: string }
        - { name: groupValue,   dbus: s, cpp: string }
        - { name: setpointType, dbus: y, cpp: u8 }
        - { name: precision,    dbus: y, cpp: u8 }
        - { name: scale,        dbus: y, cpp: u8 }
        - { name: value,        dbus: i, cpp: i32 }
      action:
        custom: emitSetLogicalThermostatSetpoint

    - name: GetLogicalThermostatState
      params:
        - { name: groupKey,   dbus: s, cpp: string }
        - { name: groupValue, dbus: s, cpp: string }
      returns:
        struct:
          - { name: memberCount,       dbus: y, source: cached.LogicalThermostatState.memberCount }
          - { name: mode,              dbus: y, source: cached.LogicalThermostatState.mode }
          - { name: operatingState,    dbus: y, source: cached.LogicalThermostatState.operatingState }
          - { name: fanMode,           dbus: y, source: cached.LogicalThermostatState.fanMode }
          - { name: setpointType,      dbus: y, source: cached.LogicalThermostatState.setpointType }
          - { name: setpointScale,     dbus: y, source: cached.LogicalThermostatState.setpointScale }
          - { name: setpointPrecision, dbus: y, source: cached.LogicalThermostatState.setpointPrecision }
          - { name: setpointValue,     dbus: i, source: cached.LogicalThermostatState.setpointValue }
      action:
        custom: emitGetLogicalThermostatState

  # ---- 3b. Signals ------------------------------------------------
  # Each signal is triggered by one or more MessageBus events. The
  # default mapping copies named fields straight through; CC-decoder
  # signals add a `decode:` step that runs an application/ codec on
  # the inbound `ccData` and rejects the trigger when it returns
  # std::nullopt.

  signals:

    - name: DongleStatus
      params:
        - { name: connected, dbus: b }
        - { name: ttyPath,   dbus: s }
      triggered_by: { event: DongleStatus }

    - name: DongleInfo
      params:
        - { name: libraryVersion,   dbus: s }
        - { name: libraryType,      dbus: y }
        - { name: homeId,           dbus: ay }
        - { name: controllerNodeId, dbus: y }
      triggered_by: { event: DongleInfo }

    - name: InitData
      params:
        - { name: serialApiVersion, dbus: y }
        - { name: capabilities,     dbus: y }
        - { name: nodeIds,          dbus: ay }
        - { name: chipType,         dbus: y }
        - { name: chipVersion,      dbus: y }
      triggered_by: { event: InitData }

    - name: NodeInclusionStatus
      params:
        - { name: sessionId,    dbus: y }
        - { name: status,       dbus: y }
        - { name: nodeId,       dbus: q }
        - { name: basicType,    dbus: y, source: basicDeviceType }
        - { name: genericType,  dbus: y, source: genericDeviceType }
        - { name: specificType, dbus: y, source: specificDeviceType }
        - { name: commandClasses, dbus: ay }
      triggered_by: { event: NodeInclusionStatus }

    - name: NodeExclusionStatus
      params:
        - { name: sessionId,    dbus: y }
        - { name: status,       dbus: y }
        - { name: nodeId,       dbus: q }
        - { name: basicType,    dbus: y, source: basicDeviceType }
        - { name: genericType,  dbus: y, source: genericDeviceType }
        - { name: specificType, dbus: y, source: specificDeviceType }
        - { name: commandClasses, dbus: ay }
      triggered_by: { event: NodeExclusionStatus }

    - name: SendDataStatus
      params:
        - { name: callbackId, dbus: y }
        - { name: txStatus,   dbus: y }
      triggered_by: { event: SendDataCallback }

    - name: ApplicationCommand
      params:
        - { name: rxStatus,     dbus: y }
        - { name: sourceNodeId, dbus: y }
        - { name: ccData,       dbus: ay }
      triggered_by: { event: ApplicationCommand }

    - name: RemoveFailedNodeStatus
      params:
        - { name: nodeId,    dbus: y }
        - { name: sessionId, dbus: y }
        - { name: phase,     dbus: y }
        - { name: status,    dbus: y }
      triggered_by: { event: RemoveFailedNodeStatus }

    - name: RequestNodeInfoStatus
      params:
        - { name: nodeId,    dbus: y }
        - { name: sessionId, dbus: y }
        - { name: accepted,  dbus: b, doc: "true iff the dongle started the request" }
      triggered_by: { event: RequestNodeInfoStatus }

    - name: NodeInfoUpdate
      params:
        - { name: status,             dbus: y, doc: "0x81 REQ_FAILED, 0x84 RECEIVED, others pass through" }
        - { name: nodeId,             dbus: y }
        - { name: basicDeviceType,    dbus: y, doc: "populated only for status=0x84" }
        - { name: genericDeviceType,  dbus: y, doc: "populated only for status=0x84" }
        - { name: specificDeviceType, dbus: y, doc: "populated only for status=0x84" }
        - { name: commandClasses,     dbus: ay, doc: "supported list, populated only for status=0x84" }
      triggered_by: { event: NodeInfoUpdate }

    - name: DaemonError
      params:
        - { name: severity, dbus: y, doc: "1=Info, 2=Warn, 3=Error, 4=Critical" }
        - { name: source,   dbus: s, doc: "publishing module name" }
        - { name: code,     dbus: y, doc: "DaemonError::CODE_* enum" }
        - { name: message,  dbus: s, doc: "human-readable; empty means 'no current error'" }
      triggered_by: { event: DaemonError }

    # -- Typed CC-report signals: trigger off the cc-translator's
    # republished typed events. The translator owns the codec call
    # so external-api never includes a CC codec header. Adding a new
    # typed signal: declare a typed bus event under `events:`, teach
    # the translator (src/cc-translator/) to publish it for the
    # matching ApplicationCommand frame, and add the signal entry
    # below.

    - name: SwitchBinaryReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: state,        dbus: y, doc: "0=Off, 1=On, 2=Unknown" }
      triggered_by:
        event: BinarySwitchReport

    - name: IndicatorReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: value,        dbus: y, doc: "0x00 off, 0x01..0x63 level, 0xFF on" }
      triggered_by:
        event: IndicatorReport

    - name: SupervisionReport
      params:
        - { name: sourceNodeId,      dbus: y }
        - { name: sessionId,         dbus: y, doc: "echoes the GET nonce" }
        - { name: moreStatusUpdates, dbus: b }
        - { name: status,            dbus: y, doc: "0 no-support, 1 working, 2 fail, 0xFF success" }
        - { name: duration,          dbus: y }
      triggered_by:
        event: SupervisionReport

    - name: MultiChannelEndPointReport
      params:
        - { name: sourceNodeId,  dbus: y }
        - { name: endpointCount, dbus: y }
        - { name: dynamic,       dbus: b }
        - { name: identical,     dbus: b }
      triggered_by:
        event: MultiChannelEndPointReport

    - name: MultiChannelCapabilityReport
      params:
        - { name: sourceNodeId,   dbus: y }
        - { name: endpoint,       dbus: y }
        - { name: generic,        dbus: y }
        - { name: specific,       dbus: y }
        - { name: commandClasses, dbus: ay }
      triggered_by:
        event: MultiChannelCapabilityReport

    - name: SwitchMultilevelReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: currentValue, dbus: y, doc: "0=off, 0x01..0x63=level 1..99, 0xFE=unknown, 0xFF=on" }
        - { name: targetValue,  dbus: y, doc: "same encoding as currentValue; mirrors current on v1 wire form" }
        - { name: duration,     dbus: y, doc: "0=instant, 0x01..0x7F=sec, 0x80..0xFE=min, 0xFF=default" }
      triggered_by:
        event: MultilevelSwitchReport

    - name: ColorSwitchReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: componentId,  dbus: y, doc: "0 warm white, 1 cold white, 2 red, 3 green, 4 blue, 5 amber, 6 cyan, 7 purple" }
        - { name: value,        dbus: y, doc: "current level 0..255" }
        - { name: targetValue,  dbus: y, doc: "transition target (mirrors value on v1)" }
        - { name: duration,     dbus: y, doc: "0=instant, 0x01..0x7F=sec, 0x80..0xFE=min, 0xFF=default" }
      triggered_by:
        event: ColorSwitchReport

    - name: CentralSceneNotification
      params:
        - { name: sourceNodeId,   dbus: y }
        - { name: sequenceNumber, dbus: y, doc: "rolling counter for de-dup" }
        - { name: keyAttribute,   dbus: y, doc: "0 press 1x, 1 release, 2 hold, 3 press 2x, 4 press 3x, …" }
        - { name: sceneNumber,    dbus: y, doc: "which button/scene" }
        - { name: slowRefresh,    dbus: b, doc: "v2+ slow-refresh flag for held keys" }
      triggered_by:
        event: CentralSceneNotification

    - name: BasicSetReceived
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: value,        dbus: y, doc: "0x00 off, 0xFF on, 0x01..0x63 level" }
      triggered_by:
        event: BasicSetReceived

    - name: SceneActivationSet
      params:
        - { name: sourceNodeId,    dbus: y }
        - { name: sceneId,         dbus: y, doc: "activated scene number 1..255" }
        - { name: dimmingDuration, dbus: y, doc: "0 instant, 1..0x7F sec, 0x80..0xFE min, 0xFF default" }
      triggered_by:
        event: SceneActivationSet

    - name: DoorLockOperationReport
      params:
        - { name: sourceNodeId,       dbus: y }
        - { name: currentMode,        dbus: y, doc: "0x00 unsecured, 0xFF secured, 0x01/0x10/0x11 timeout/handles" }
        - { name: handlesMode,        dbus: y, doc: "inside/outside door-handle mode bitfield" }
        - { name: condition,          dbus: y, doc: "door/bolt/latch condition flags" }
        - { name: lockTimeoutMinutes, dbus: y, doc: "0xFE = not supported" }
        - { name: lockTimeoutSeconds, dbus: y, doc: "0xFE = not supported" }
        - { name: targetMode,         dbus: y, doc: "v4+ transition target (0 otherwise)" }
        - { name: duration,           dbus: y, doc: "v4+ transition duration (0 otherwise)" }
      triggered_by:
        event: DoorLockOperationReport

    - name: UserCodeReport
      params:
        - { name: sourceNodeId,   dbus: y }
        - { name: userIdentifier, dbus: y, doc: "slot number" }
        - { name: userIdStatus,   dbus: y, doc: "0x00 available, 0x01 enabled, 0xFE not-available" }
        - { name: userCode,       dbus: ay, doc: "raw 4-10 ASCII digits; empty when slot free" }
      triggered_by:
        event: UserCodeReport

    - name: UserCodeUsersNumberReport
      params:
        - { name: sourceNodeId,   dbus: y }
        - { name: supportedUsers, dbus: y, doc: "number of code slots the lock has" }
      triggered_by:
        event: UserCodeUsersNumberReport

    - name: BatteryReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: level,        dbus: y, doc: "0x00..0x64 = 0..100%, 0xFF = low-battery warning" }
        - { name: lowBattery,   dbus: b, doc: "true iff level == 0xFF" }
      triggered_by:
        event: BatteryReport

    - name: SensorMultilevelReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: sensorType,   dbus: y, doc: "0x01 air temp, 0x03 luminance, 0x05 humidity, …" }
        - { name: scale,        dbus: y, doc: "0..3, sensor-type-specific unit" }
        - { name: precision,    dbus: y, doc: "reading = value / 10^precision" }
        - { name: value,        dbus: i, doc: "raw signed value" }
      triggered_by:
        event: SensorMultilevelReport

    - name: SensorBinaryReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: sensorType,   dbus: y, doc: "0 for v1 reports; device sensor-type code for v2+" }
        - { name: value,        dbus: y, doc: "0x00 idle / 0xFF active" }
      triggered_by:
        event: SensorBinaryReport

    - name: NotificationReport
      params:
        - { name: sourceNodeId,     dbus: y }
        - { name: notificationType, dbus: y, doc: "0x06 access, 0x07 home security, 0x08 power, …" }
        - { name: event,            dbus: y, doc: "type-specific (0x07/0x08 = motion)" }
        - { name: status,           dbus: y, doc: "notificationStatus: 0x00 or 0xFF" }
        - { name: parameters,       dbus: ay, doc: "event-specific, often empty" }
      triggered_by:
        event: NotificationReport

    - name: MeterReport
      params:
        - { name: sourceNodeId,  dbus: y }
        - { name: meterType,     dbus: y, doc: "1 electric, 2 gas, 3 water" }
        - { name: rateType,      dbus: y, doc: "1 import, 2 export (v2+)" }
        - { name: scale,         dbus: y, doc: "unit selector, meterType-specific" }
        - { name: precision,     dbus: y, doc: "reading = value / 10^precision" }
        - { name: value,         dbus: i, doc: "raw signed current reading" }
        - { name: deltaTime,     dbus: q, doc: "seconds since previousValue sample; 0 = none" }
        - { name: previousValue, dbus: i, doc: "raw signed previous reading; valid iff hasPrevious" }
        - { name: hasPrevious,   dbus: b, doc: "true when deltaTime != 0 and a previousValue was present" }
      triggered_by:
        event: MeterReport

    - name: ThermostatModeReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: mode,         dbus: y, doc: "0 off, 1 heat, 2 cool, 3 auto, 6 fan only, 8 dry, …" }
      triggered_by:
        event: ThermostatModeReport

    - name: ThermostatSetpointReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: setpointType, dbus: y, doc: "1 heating, 2 cooling, …" }
        - { name: scale,        dbus: y, doc: "0 = °C, 1 = °F" }
        - { name: precision,    dbus: y, doc: "reading = value / 10^precision" }
        - { name: value,        dbus: i, doc: "raw signed target temperature" }
      triggered_by:
        event: ThermostatSetpointReport

    - name: ThermostatOperatingStateReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: state,        dbus: y, doc: "0 idle, 1 heating, 2 cooling, 3 fan only, …" }
      triggered_by:
        event: ThermostatOperatingStateReport

    - name: ThermostatFanModeReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: mode,         dbus: y, doc: "0 auto low, 1 low, 2 auto high, 3 high, …" }
        - { name: "off",        dbus: b, doc: "fan-off flag (bit 7 of the wire byte)" }
      triggered_by:
        event: ThermostatFanModeReport

    - name: ManufacturerSpecificReport
      params:
        - { name: sourceNodeId,   dbus: y }
        - { name: manufacturerId, dbus: q }
        - { name: productTypeId,  dbus: q }
        - { name: productId,      dbus: q }
      triggered_by:
        event: ManufacturerSpecificReport

    - name: ZWavePlusInfoReport
      params:
        - { name: sourceNodeId,      dbus: y }
        - { name: zwavePlusVersion,  dbus: y, doc: "typically 0x02" }
        - { name: roleType,          dbus: y, doc: "0x00..0x07; see event for enum" }
        - { name: nodeType,          dbus: y, doc: "0x00 = node, 0x02 = IP gateway" }
        - { name: installerIconType, dbus: q }
        - { name: userIconType,      dbus: q }
      triggered_by:
        event: ZWavePlusInfoReport

    - name: NodeVersionReport
      params:
        - { name: sourceNodeId,          dbus: y }
        - { name: libraryType,           dbus: y, doc: "HostApi::LIBRARY_TYPE_* (1=StaticCtrl, 2=Ctrl, 3=EnhSlave, 4=Slave, …)" }
        - { name: protocolVersion,       dbus: y }
        - { name: protocolSubVersion,    dbus: y }
        - { name: applicationVersion,    dbus: y }
        - { name: applicationSubVersion, dbus: y }
      triggered_by:
        event: NodeVersionReport

    - name: ConfigurationReport
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: parameter,    dbus: y }
        - { name: size,         dbus: y, doc: "1, 2, or 4" }
        - { name: value,        dbus: i, doc: "sign-extended from size's MSB; cast to uint32 if your parameter is unsigned" }
      triggered_by:
        event: ConfigurationReport

    - name: WakeUpIntervalReport
      params:
        - { name: sourceNodeId,     dbus: y }
        - { name: seconds,          dbus: u, doc: "24-bit interval; 0 = stay-awake" }
        - { name: controllerNodeId, dbus: y }
      triggered_by:
        event: WakeUpIntervalReport

    - name: WakeUpNotification
      params:
        - { name: sourceNodeId, dbus: y }
      triggered_by:
        event: WakeUpNotification

    - name: WakeUpCycleComplete
      params:
        - { name: nodeId,       dbus: y }
        - { name: drainedCount, dbus: u }
      triggered_by:
        event: WakeUpCycleComplete

    - name: PendingCommandEnqueued
      params:
        - { name: nodeId,   dbus: y }
        - { name: sequence, dbus: u }
        - { name: priority, dbus: y }
      triggered_by:
        event: PendingCommandEnqueued

    - name: PendingCommandsDrained
      params:
        - { name: nodeId, dbus: y }
        - { name: count,  dbus: u }
      triggered_by:
        event: PendingCommandsDrained

    - name: InclusionLifelineSet
      params:
        - { name: nodeId, dbus: y }
      triggered_by:
        event: InclusionLifelineSet

    - name: InclusionPolicyApplied
      params:
        - { name: nodeId,         dbus: y }
        - { name: entriesApplied, dbus: u }
      triggered_by:
        event: InclusionPolicyApplied

    - name: InclusionComplete
      params:
        - { name: nodeId, dbus: y }
      triggered_by:
        event: InclusionComplete

    - name: NodeMetadataChanged
      params:
        - { name: nodeId, dbus: y }
      triggered_by:
        event: NodeMetadataChanged

    - name: SceneActivated
      params:
        - { name: sourceNodeId, dbus: y }
        - { name: sceneNumber,  dbus: y }
        - { name: keyAttribute, dbus: y }
        - { name: sceneId,      dbus: s }
        - { name: actionCount,  dbus: u }
      triggered_by:
        event: SceneActivated

    - name: LogicalThermostatStateChanged
      params:
        - { name: groupKey,          dbus: s }
        - { name: groupValue,        dbus: s }
        - { name: memberCount,       dbus: y }
        - { name: mode,              dbus: y, doc: "0xFF = members disagree (mixed)" }
        - { name: operatingState,    dbus: y }
        - { name: fanMode,           dbus: y, doc: "0xFF = members disagree (mixed)" }
        - { name: setpointType,      dbus: y }
        - { name: setpointScale,     dbus: y }
        - { name: setpointPrecision, dbus: y }
        - { name: setpointValue,     dbus: i }
      triggered_by:
        event: LogicalThermostatState

# =====================================================================
# 4. Protocol modules
# =====================================================================
# A module is the daemon-side codec for one protocol feature — today a
# Z-Wave Command Class; a second-protocol daemon would model Zigbee
# clusters, KNX functional blocks, etc. the same way. Wire-specific
# identifiers (`class_byte`, `prefix`, per-command `byte`) live under
# nested `wire:` blocks so the rest of the schema stays protocol-
# agnostic. The codegen target is the
# `src/zwave-protocol/application/<Name>.{hpp,cpp}` pair; modules are
# consumed by ProtocolThread (encode → SendData) and by the typed-
# report D-Bus signals (decode → typed signal payload).

modules:

  - name: BinarySwitch
    # Per-command byte constants are emitted as <wire.prefix>_<CMD>,
    # mirroring the Z-Wave spec naming. Without an explicit
    # `wire.prefix:`, the codegen falls back to camelCase-to-
    # SCREAMING_SNAKE on the module name (which differs from spec for
    # several CCs — e.g. BinarySwitch's wire name is SWITCH_BINARY,
    # MultichannelAssociation's is MULTI_CHANNEL_ASSOCIATION).
    wire:
      class_byte: 0x25
      prefix: SWITCH_BINARY
    description: |
      Binary on/off control. SET takes a single value byte
      (0=off, 0xFF=on); REPORT carries the current state.
    constants:
      - { name: VALUE_OFF,     value: 0x00 }
      - { name: VALUE_ON,      value: 0xFF }
      - { name: VALUE_UNKNOWN, value: 0xFE }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "turnOn ? VALUE_ON : VALUE_OFF"
        encode_args:
          - { name: turnOn, type: bool }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: rawValue, type: u8 }
          - { name: state,    type: enum, doc: "Off | On | Unknown" }

  - name: MultilevelSwitch
    wire:
      class_byte: 0x26
      prefix: SWITCH_MULTILEVEL
    description: |
      Multilevel control — dimmers, blinds, fan speed. SET takes a
      value byte plus (v2+) a duration byte; the daemon always emits
      the v2 wire form so v1-only devices ignore the trailing byte
      per spec.
    constants:
      - { name: VALUE_OFF,        value: 0x00 }
      - { name: VALUE_MAX,        value: 0x63 }
      - { name: VALUE_UNKNOWN,    value: 0xFE }
      - { name: VALUE_RESTORE,    value: 0xFF }
      - { name: DURATION_INSTANT, value: 0x00 }
      - { name: DURATION_DEFAULT, value: 0xFF }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "value"
            - "duration"
        encode_args:
          - { name: value,    type: u8 }
          - { name: duration, type: u8 }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: currentValue, type: u8 }
          - { name: targetValue,  type: u8 }
          - { name: duration,     type: u8 }
          - { name: wireFormatV2, type: bool, doc: "true if 5-byte v2+ wire form" }

  - name: ColorSwitch
    wire:
      class_byte: 0x33
      prefix: SWITCH_COLOR
    description: |
      Multi-component colour control — RGB / RGBW / CCT lighting. GET takes
      a componentId; REPORT carries that component's value (v3+ adds the
      transition target + duration). SET carries a variable-length list of
      (componentId, value) pairs plus a trailing duration, so a single frame
      can update a whole RGB triple atomically. componentId: 0 warm white,
      1 cold white, 2 red, 3 green, 4 blue, 5 amber, 6 cyan, 7 purple. GET
      and SET carry variable / argument payloads, so the encoders live in
      the hand-written ColorSwitch.cpp. SUPPORTED_GET/REPORT and
      START/STOP_LEVEL_CHANGE are not implemented.
    constants:
      - { name: COMPONENT_WARM_WHITE, value: 0x00 }
      - { name: COMPONENT_COLD_WHITE, value: 0x01 }
      - { name: COMPONENT_RED,        value: 0x02 }
      - { name: COMPONENT_GREEN,      value: 0x03 }
      - { name: COMPONENT_BLUE,       value: 0x04 }
    commands:
      - name: Get
        wire:
          byte: 0x03
      - name: Report
        wire:
          byte: 0x04
        decoded_struct:
          - { name: componentId, type: u8 }
          - { name: value,       type: u8 }
          - { name: targetValue, type: u8 }
          - { name: duration,    type: u8 }
      - name: Set
        wire:
          byte: 0x05

  - name: CentralScene
    wire:
      class_byte: 0x5B
      prefix: CENTRAL_SCENE
    description: |
      Push-only scene events from physical button presses on remotes and
      wall switches. The daemon never sends Central Scene frames — it only
      decodes inbound NOTIFICATION (0x03) frames into a typed signal.
      keyAttribute: 0 press 1×, 1 release, 2 hold, 3 press 2×, 4 press 3×,
      5 press 4×, 6 press 5×. The v1+ NOTIFICATION decode lives in the
      hand-written CentralScene.cpp; SUPPORTED_GET/REPORT and the v3+
      Configuration triplet are not implemented.
    constants:
      - { name: KEY_PRESS_1X, value: 0x00 }
      - { name: KEY_RELEASE,  value: 0x01 }
      - { name: KEY_HELD,     value: 0x02 }
      - { name: KEY_PRESS_2X, value: 0x03 }
    commands:
      - name: Notification
        wire:
          byte: 0x03
        decoded_struct:
          - { name: sequenceNumber, type: u8 }
          - { name: keyAttribute,   type: u8,   doc: "0 press1x, 1 release, 2 hold, 3 press2x, …" }
          - { name: sceneNumber,    type: u8 }
          - { name: slowRefresh,    type: bool, doc: "v2+ slow-refresh flag (bit 7 of properties)" }

  - name: SceneActivation
    wire:
      class_byte: 0x2B
      prefix: SCENE_ACTIVATION
    description: |
      Push-only scene events from controllers that announce "scene N is
      now active" via SCENE_ACTIVATION_SET (0x01). The daemon never sends
      Scene Activation frames — it only decodes the inbound SET into a
      typed signal the SceneOrchestrator (#124) keys triggers on. The
      decode lives in the hand-written SceneActivation.cpp.
    commands:
      - name: Set
        wire:
          byte: 0x01
        decoded_struct:
          - { name: sceneId,         type: u8, doc: "activated scene number 1..255" }
          - { name: dimmingDuration, type: u8, doc: "0 instant, 1..0x7F sec, 0x80..0xFE min, 0xFF default" }

  - name: DoorLock
    wire:
      class_byte: 0x62
      prefix: DOOR_LOCK
    description: |
      Door lock operation. OPERATION_SET takes a single mode byte;
      OPERATION_REPORT carries the current mode + door-handle mode +
      condition + lock-timeout, and (v4+) a target mode + duration. mode:
      0x00 unsecured, 0x01 unsecured w/ timeout, 0x10 inside-handles, 0x11
      inside-handles w/ timeout, 0xFF secured. The Configuration triplet
      (auto-relock) is deferred. Almost every real lock requires Security
      S0/S2 transport (#26/#27) — this codec exercises the unencrypted wire
      shape; on-device proof is gated on the security epics.
    constants:
      - { name: MODE_UNSECURED, value: 0x00 }
      - { name: MODE_SECURED,   value: 0xFF }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "mode"
        encode_args:
          - { name: mode, type: u8 }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: currentMode,        type: u8 }
          - { name: handlesMode,        type: u8 }
          - { name: condition,          type: u8 }
          - { name: lockTimeoutMinutes, type: u8 }
          - { name: lockTimeoutSeconds, type: u8 }
          - { name: targetMode,         type: u8, doc: "v4+ (0 otherwise)" }
          - { name: duration,           type: u8, doc: "v4+ (0 otherwise)" }

  - name: UserCode
    wire:
      class_byte: 0x63
      prefix: USER_CODE
    description: |
      Per-slot PIN management for locks. SET writes a slot's
      (userIdStatus, userCode); GET reads one slot; REPORT carries the
      slot's status + code. USERS_NUMBER_GET/REPORT report how many slots
      the lock has. SET carries a variable-length ASCII code, so its encoder
      is hand-written in UserCode.cpp; GET and USERS_NUMBER_GET are
      generated. Like Door Lock, real devices require Security S0/S2.
    constants:
      - { name: STATUS_AVAILABLE,     value: 0x00 }
      - { name: STATUS_OCCUPIED,      value: 0x01 }
      - { name: STATUS_NOT_AVAILABLE, value: 0xFE }
    commands:
      - name: Set
        wire:
          byte: 0x01
      - name: Get
        wire:
          byte: 0x02
          payload:
            - "userIdentifier"
        encode_args:
          - { name: userIdentifier, type: u8 }
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: userIdentifier, type: u8 }
          - { name: userIdStatus,   type: u8 }
          - { name: userCode,       type: bytes }
      - name: UsersNumberGet
        wire:
          byte: 0x04
          payload: []
        encode_args: []
      - name: UsersNumberReport
        wire:
          byte: 0x05
        decoded_struct:
          - { name: supportedUsers, type: u8 }

  - name: Battery
    wire:
      class_byte: 0x80
      prefix: BATTERY
    description: |
      Battery status reporting for battery-powered nodes. Get returns
      a Report carrying the battery percentage (0..100) or 0xFF as a
      low-battery warning. v2 adds charging / health bitfields; the
      decoder ignores them today and only surfaces the percentage +
      a derived lowBattery flag.
    constants:
      - { name: LEVEL_LOW_WARNING, value: 0xFF }
    commands:
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: level,      type: u8,   doc: "raw wire byte: 0x00..0x64 = 0..100%, 0xFF = low" }
          - { name: lowBattery, type: bool, doc: "true iff level == LEVEL_LOW_WARNING" }

  - name: SensorMultilevel
    wire:
      class_byte: 0x31
      prefix: SENSOR_MULTILEVEL
    description: |
      Multilevel sensor reporting — temperature, humidity, luminance,
      power, etc. A Report carries a sensorType byte, a packed
      precision/scale/size flag byte, and a signed big-endian value of
      1, 2, or 4 bytes. The real reading is value / 10^precision in the
      unit selected by (sensorType, scale) — e.g. air temperature
      (type 0x01) scale 0 = Celsius, 1 = Fahrenheit. v1 Get takes no
      payload (returns the device's primary sensor); the v5+ type-filtered
      Get and SUPPORTED_GET/REPORT are not implemented yet.
    constants:
      - { name: FLAG_SIZE_MASK,       value: 0x07 }
      - { name: FLAG_SCALE_MASK,      value: 0x18 }
      - { name: FLAG_SCALE_SHIFT,     value: 3 }
      - { name: FLAG_PRECISION_MASK,  value: 0xE0 }
      - { name: FLAG_PRECISION_SHIFT, value: 5 }
    commands:
      - name: Get
        wire:
          byte: 0x04
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x05
        decoded_struct:
          - { name: sensorType, type: u8,  doc: "0x01 air temp, 0x03 luminance, 0x05 humidity, …" }
          - { name: scale,      type: u8,  doc: "0..3, sensor-type-specific unit selector" }
          - { name: precision,  type: u8,  doc: "decimal-point shift: reading = value / 10^precision" }
          - { name: value,      type: i32, doc: "raw signed value (1/2/4-byte BE, sign-extended)" }

  - name: SensorBinary
    wire:
      class_byte: 0x30
      prefix: SENSOR_BINARY
    description: |
      Binary sensor reporting — door/window contact, motion, tamper.
      Officially deprecated by Notification (CC 0x71) but still present on
      most legacy sensors, and many controllers map its Reports to the same
      semantic event (decode both, dedupe upstream). A v1 Report is a single
      value byte (0x00 idle / 0xFF active); v2 appends a sensorType byte for
      devices packing multiple binary sensors. v1 Get takes no payload
      (returns the device's primary sensor); the v2 type-filtered Get and
      SUPPORTED_GET/REPORT are not implemented yet.
    constants:
      - { name: VALUE_IDLE,   value: 0x00 }
      - { name: VALUE_ACTIVE, value: 0xFF }
    commands:
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: sensorType, type: u8, doc: "0 for v1 reports; device sensor-type code for v2+" }
          - { name: value,      type: u8, doc: "0x00 idle / 0xFF active" }

  - name: Notification
    wire:
      class_byte: 0x71
      prefix: NOTIFICATION
    description: |
      Push events from sensors — motion, water leak, smoke, tamper, etc.
      Supersedes Sensor Binary (CC 0x30) for modern devices. A v3+ Report
      carries legacy v1 alarm fields (ignored by the typed decoder — they
      still ride the raw ApplicationCommand signal), then a
      notificationStatus, a `(notificationType, event)` pair, and a
      variable-length event-parameter blob. notificationType: 0x06 access
      control, 0x07 home security (event 0x08 = motion), 0x08 power, etc.
      The `(type, event)` matrix is large, so the codec returns the raw
      triple and leaves naming to callers (a name table is a follow-up).
      Get/Report carry variable-width payloads the simple-encoder
      generator can't express, so they live in the hand-written
      Notification.cpp. v1 alarm Get/Report, Set, and SUPPORTED_GET/REPORT
      are not implemented.
    commands:
      - name: Get
        wire:
          byte: 0x04
      - name: Report
        wire:
          byte: 0x05
        decoded_struct:
          - { name: notificationType, type: u8 }
          - { name: event,            type: u8 }
          - { name: status,           type: u8,    doc: "notificationStatus: 0x00 or 0xFF" }
          - { name: parameters,       type: bytes, doc: "event-specific, often empty" }

  - name: Meter
    wire:
      class_byte: 0x32
      prefix: METER
    description: |
      Accumulated-consumption metering — electric (kWh/W/V/A), gas, water.
      Common on smart plugs. A v3+ Report carries a meterType + rateType in
      the first properties byte, then a packed precision/scale/size flag
      byte, a signed big-endian current value of 1/2/4 bytes, a 16-bit
      deltaTime (seconds since the previous sample), and — only when
      deltaTime != 0 — a previous value of the same width, so clients can
      compute an instantaneous rate without keeping state. The real reading
      is value / 10^precision in the unit selected by (meterType, scale).
      The Get carries an optional scale selector (v2+), so it lives in the
      hand-written Meter.cpp. v4 dual-scale, SUPPORTED_GET/REPORT, and RESET
      are not implemented yet.
    constants:
      - { name: TYPE_ELECTRIC,         value: 0x01 }
      - { name: TYPE_GAS,              value: 0x02 }
      - { name: TYPE_WATER,            value: 0x03 }
      - { name: PROP1_METER_TYPE_MASK, value: 0x1F }
      - { name: PROP1_RATE_TYPE_MASK,  value: 0x60 }
      - { name: PROP1_RATE_TYPE_SHIFT, value: 5 }
      - { name: PROP1_SCALE_BIT2_MASK, value: 0x80 }
      - { name: FLAG_SIZE_MASK,        value: 0x07 }
      - { name: FLAG_SCALE_MASK,       value: 0x18 }
      - { name: FLAG_SCALE_SHIFT,      value: 3 }
      - { name: FLAG_PRECISION_MASK,   value: 0xE0 }
      - { name: FLAG_PRECISION_SHIFT,  value: 5 }
    commands:
      - name: Get
        wire:
          byte: 0x01
      - name: Report
        wire:
          byte: 0x02
        decoded_struct:
          - { name: meterType,     type: u8,   doc: "1 electric, 2 gas, 3 water" }
          - { name: rateType,      type: u8,   doc: "1 import, 2 export (v2+)" }
          - { name: scale,         type: u8,   doc: "unit selector, meterType-specific" }
          - { name: precision,     type: u8,   doc: "reading = value / 10^precision" }
          - { name: value,         type: i32,  doc: "raw signed current value (1/2/4-byte BE)" }
          - { name: deltaTime,     type: u16,  doc: "seconds since previousValue sample; 0 = none" }
          - { name: previousValue, type: i32,  doc: "raw signed previous value; valid iff hasPrevious" }
          - { name: hasPrevious,   type: bool, doc: "true iff deltaTime != 0 and previousValue present" }

  - name: ThermostatMode
    wire:
      class_byte: 0x40
      prefix: THERMOSTAT_MODE
    description: |
      HVAC operating mode. SET takes a single mode byte (the low 5 bits;
      the high 3 bits are a v3 manufacturer-data length, sent as 0 here);
      REPORT carries the current mode. mode: 0 off, 1 heat, 2 cool, 3 auto,
      4 aux heat, 6 fan only, 7 furnace, 8 dry, 9 moist, 10 auto changeover,
      11 energy-save heat, 12 energy-save cool, 13 away. The decoder returns
      the raw byte and leaves naming to clients. First of the split
      thermostat quartet (epic #23).
    constants:
      - { name: MODE_OFF,  value: 0x00 }
      - { name: MODE_HEAT, value: 0x01 }
      - { name: MODE_COOL, value: 0x02 }
      - { name: MODE_AUTO, value: 0x03 }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "mode"
        encode_args:
          - { name: mode, type: u8 }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: mode, type: u8, doc: "0 off, 1 heat, 2 cool, 3 auto, 6 fan only, 8 dry, …" }

  - name: ThermostatSetpoint
    wire:
      class_byte: 0x43
      prefix: THERMOSTAT_SETPOINT
    description: |
      HVAC target temperature, one per setpoint type. SET and REPORT carry
      a setpointType byte (low 4 bits) followed by the SDS13781
      precision/scale/size encoded value — the exact encoding Sensor
      Multilevel uses, shared via the EncodedValue helper. scale 0 = °C,
      1 = °F. setpointType: 1 heating, 2 cooling, 7 furnace, 8 dry air,
      9 moist air, 10 auto changeover. SET and GET both carry payload args,
      so the encoders live in the hand-written ThermostatSetpoint.cpp.
      Second of the split thermostat quartet (epic #23). SUPPORTED_GET/
      REPORT and CAPABILITIES_GET are not implemented.
    constants:
      - { name: TYPE_HEATING, value: 0x01 }
      - { name: TYPE_COOLING, value: 0x02 }
    commands:
      - name: Set
        wire:
          byte: 0x01
      - name: Get
        wire:
          byte: 0x02
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: setpointType, type: u8,  doc: "1 heating, 2 cooling, …" }
          - { name: scale,        type: u8,  doc: "0 = °C, 1 = °F" }
          - { name: precision,    type: u8,  doc: "reading = value / 10^precision" }
          - { name: value,        type: i32, doc: "raw signed target temperature" }

  - name: ThermostatOperatingState
    wire:
      class_byte: 0x42
      prefix: THERMOSTAT_OPERATING_STATE
    description: |
      Read-only report of what the HVAC is currently doing. GET takes no
      payload; REPORT carries a state byte (low 4 bits). state: 0 idle,
      1 heating, 2 cooling, 3 fan only, 4 pending heat, 5 pending cool,
      6 vent/economizer. The decoder returns the raw value and leaves
      naming to clients. Third of the split thermostat quartet (epic #23);
      no Set (read-only). SUPPORTED_GET/REPORT not implemented.
    constants:
      - { name: STATE_IDLE,    value: 0x00 }
      - { name: STATE_HEATING, value: 0x01 }
      - { name: STATE_COOLING, value: 0x02 }
    commands:
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: state, type: u8, doc: "0 idle, 1 heating, 2 cooling, 3 fan only, …" }

  - name: ThermostatFanMode
    wire:
      class_byte: 0x44
      prefix: THERMOSTAT_FAN_MODE
    description: |
      HVAC fan behaviour. SET and REPORT carry one properties byte: the low
      4 bits are the fan mode, bit 7 is a separate "fan off" flag. mode:
      0 auto low, 1 low, 2 auto high, 3 high, 4 auto medium, 5 medium, …
      The decoder splits the byte into (mode, off); the encoder packs them
      back (like BinarySwitch, the SET payload is a manifest expression, so
      both encoders are generated). Last of the split thermostat quartet
      (epic #23). SUPPORTED_GET/REPORT are not implemented.
    constants:
      - { name: MODE_MASK,      value: 0x0F }
      - { name: OFF_FLAG,       value: 0x80 }
      - { name: MODE_AUTO_LOW,  value: 0x00 }
      - { name: MODE_LOW,       value: 0x01 }
      - { name: MODE_AUTO_HIGH, value: 0x02 }
      - { name: MODE_HIGH,      value: 0x03 }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "static_cast<std::uint8_t>((off ? OFF_FLAG : 0x00) | (mode & MODE_MASK))"
        encode_args:
          - { name: mode,  type: u8 }
          - { name: "off", type: bool }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: mode,  type: u8,   doc: "low 4 bits of the properties byte" }
          - { name: "off", type: bool, doc: "bit 7 of the properties byte" }

  - name: Configuration
    wire:
      class_byte: 0x70
      prefix: CONFIGURATION
    description: |
      Vendor-defined parameter store. v1 carries a single
      `(parameter, size, value)` triple per frame; the size byte
      selects a 1, 2, or 4-byte big-endian value. The Z-Wave spec
      treats values as two's-complement signed by convention — the
      codec sign-extends on decode and truncates the low `size`
      bytes on encode, so a caller who knows their parameter is
      unsigned can pass the value as the signed reinterpretation
      and read it back the same way.

      v4 adds Bulk Set/Get/Report (0x07/0x08/0x09) and a default-
      value flag; not implemented today.

      Set/Get/Report all carry irregular variable-width payloads
      that the simple-encoder generator can't express, so all
      three live in the hand-written Configuration.cpp.
    commands:
      - name: Set
        wire:
          byte: 0x04
      - name: Get
        wire:
          byte: 0x05
      - name: Report
        wire:
          byte: 0x06
        decoded_struct:
          - { name: parameter, type: u8 }
          - { name: size,      type: u8 }
          - { name: value,     type: i32, doc: "sign-extended from size's MSB" }

  - name: WakeUp
    wire:
      class_byte: 0x84
      prefix: WAKE_UP
    description: |
      Sleeping-node lifecycle. The Interval Set/Get/Report trio
      configures how often the node phones home; the Notification
      (node → host) signals "I'm briefly awake, send me anything
      pending"; NoMoreInformation (host → node) is the daemon's
      "go back to sleep now" reply.

      Set carries a 24-bit big-endian seconds field plus a
      single-byte controllerNodeId — too irregular for the
      manifest's payload generator, so encodeIntervalSet is
      hand-written in WakeUp.cpp. Get and NoMoreInformation are
      empty-payload, so their encoders come from the .gen.cpp.
    commands:
      - name: Set
        wire:
          byte: 0x04
      - name: Get
        wire:
          byte: 0x05
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x06
        decoded_struct:
          - { name: seconds,          type: u32 }
          - { name: controllerNodeId, type: u8 }
      - name: Notification
        wire:
          byte: 0x07
      - name: NoMoreInformation
        wire:
          byte: 0x08
          payload: []
        encode_args: []

  - name: NodeVersion
    wire:
      class_byte: 0x86
      prefix: VERSION
    description: |
      Z-Wave Version CC (0x86) — reports a *node's* Z-Wave library
      type, Z-Wave protocol version, and application version.
      Distinct from the daemon's own version (Version::SEMVER); the
      module is named `NodeVersion` to keep that distinction loud at
      every call site, but the wire `prefix:` stays `VERSION` so the
      generated `VERSION_GET` (0x11) and `VERSION_REPORT` (0x12)
      constants still match the Z-Wave spec. Commands live in the
      0x10s, not 0x01-0x05 like most CCs.

      v2 adds hardware version + a per-firmware-target list; v1 is
      what most v1/v2 nodes answer with and is what we decode today.
    commands:
      - name: Get
        wire:
          byte: 0x11
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x12
        decoded_struct:
          - { name: libraryType,           type: u8 }
          - { name: protocolVersion,       type: u8 }
          - { name: protocolSubVersion,    type: u8 }
          - { name: applicationVersion,    type: u8 }
          - { name: applicationSubVersion, type: u8 }

  - name: ZWavePlusInfo
    wire:
      class_byte: 0x5E
      prefix: ZWAVEPLUS_INFO
    description: |
      Z-Wave Plus identification. Get returns a Report carrying the
      Z-Wave Plus protocol version, role/node type, and a pair of
      device-database icon hints (installer + user). Unusually for a
      Z-Wave CC, GET is byte 0x01 and REPORT is byte 0x02 (most CCs
      use 0x02/0x03 or 0x04/0x05) — follow the spec, not the pattern.
    commands:
      - name: Get
        wire:
          byte: 0x01
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x02
        decoded_struct:
          - { name: zwavePlusVersion,  type: u8 }
          - { name: roleType,          type: u8 }
          - { name: nodeType,          type: u8 }
          - { name: installerIconType, type: u16 }
          - { name: userIconType,      type: u16 }

  - name: ManufacturerSpecific
    wire:
      class_byte: 0x72
      prefix: MANUFACTURER_SPECIFIC
    description: |
      Per-node identification — manufacturer ID, product type ID and
      product ID are all u16 values assigned by the Z-Wave alliance.
      Together they pin down which physical device the node is, which
      lets a controller look up device-specific quirks. v2 adds a
      Device Specific Get / Report pair for serial numbers / OEM
      data; not implemented today.
    commands:
      - name: Get
        wire:
          byte: 0x04
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x05
        decoded_struct:
          - { name: manufacturerId, type: u16 }
          - { name: productTypeId,  type: u16 }
          - { name: productId,      type: u16 }

  - name: Basic
    wire:
      class_byte: 0x20
      prefix: BASIC
    description: |
      Universal-fallback CC. Devices without a more specific CC for
      their primary behaviour map Basic onto whatever does make
      sense (a switch becomes on/off, a dimmer becomes 0..99).
    constants:
      - { name: VALUE_OFF,     value: 0x00 }
      - { name: VALUE_ON,      value: 0xFF }
      - { name: VALUE_UNKNOWN, value: 0xFE }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "value"
        encode_args:
          - { name: value, type: u8 }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: currentValue, type: u8 }
          - { name: targetValue,  type: u8 }
          - { name: duration,     type: u8 }
          - { name: wireFormatV2, type: bool, doc: "true if 5-byte v2+ wire form" }

  - name: Association
    wire:
      class_byte: 0x85
      prefix: ASSOCIATION
    description: |
      Per-group association lists -- group 1 is conventionally the
      lifeline, owned by the primary controller.
    commands:
      - { name: Set,             wire: { byte: 0x01 } }
      - { name: Get,             wire: { byte: 0x02 } }
      - { name: Report,          wire: { byte: 0x03 } }
      - { name: Remove,          wire: { byte: 0x04 } }
      - { name: GroupingsGet,    wire: { byte: 0x05 } }
      - { name: GroupingsReport, wire: { byte: 0x06 } }

  - name: MultichannelAssociation
    wire:
      class_byte: 0x8E
      prefix: MULTI_CHANNEL_ASSOCIATION
    description: |
      Like plain Association but each group can hold both whole-node
      members and (nodeId, endpoint) pair members, separated on the
      wire by MARKER = 0x00. REMOVE with both lists empty omits the
      MARKER and means "remove all members."
    constants:
      - { name: MARKER, value: 0x00 }
    commands:
      - { name: Set,             wire: { byte: 0x01 } }
      - { name: Get,             wire: { byte: 0x02 } }
      - { name: Report,          wire: { byte: 0x03 } }
      - { name: Remove,          wire: { byte: 0x04 } }
      - { name: GroupingsGet,    wire: { byte: 0x05 } }
      - { name: GroupingsReport, wire: { byte: 0x06 } }

  - name: MultiChannel
    wire:
      class_byte: 0x60
      prefix: MULTI_CHANNEL
    description: |
      Multi Channel (CC 0x60) encapsulation layer (E1 Tier 2, #144). Wraps
      an inner Command Class frame with a source + destination endpoint so a
      single node can present several addressable endpoints. Only the v2+
      MULTI_CHANNEL_CMD_ENCAP (0x0D) is handled. The encap/decap is
      hand-written (variable-length inner payload) in MultiChannel.cpp; the
      manifest contributes the command byte + endpoint-field masks. Inbound
      decap feeds the endpoint routing (#146); encode wraps an outbound
      endpoint-addressed frame.
    constants:
      # Endpoint fields: low 7 bits are the endpoint, bit 7 of the
      # destination byte is the "bit address" flag (multicast to a bitmask
      # of endpoints rather than a single one).
      - { name: ENDPOINT_MASK,           value: 0x7F }
      - { name: BIT_ADDRESS_FLAG,        value: 0x80 }
      # End Point Report properties1: bit 7 dynamic (count changes),
      # bit 6 identical (all endpoints share capabilities).
      - { name: ENDPOINT_DYNAMIC_FLAG,   value: 0x80 }
      - { name: ENDPOINT_IDENTICAL_FLAG, value: 0x40 }
    commands:
      - name: Encap
        wire:
          byte: 0x0D
        decoded_struct:
          - { name: sourceEndpoint,      type: u8 }
          - { name: destinationEndpoint, type: u8 }
          - { name: bitAddress,          type: bool, doc: "destination is a bitmask of endpoints" }
          - { name: innerCommand,        type: bytes, doc: "encapsulated CC frame (class + cmd + params)" }
      # Endpoint discovery (#13, controller side). Get encoders + Report
      # decoders are hand-written in MultiChannel.cpp; the manifest just
      # contributes the command bytes (decoded_struct documents the shape).
      - name: EndpointGet
        wire:
          byte: 0x07
      - name: EndpointReport
        wire:
          byte: 0x08
        decoded_struct:
          - { name: endpointCount, type: u8 }
          - { name: dynamic,       type: bool }
          - { name: identical,     type: bool }
      - name: CapabilityGet
        wire:
          byte: 0x09
      - name: CapabilityReport
        wire:
          byte: 0x0A
        decoded_struct:
          - { name: endpoint,       type: u8 }
          - { name: generic,        type: u8 }
          - { name: specific,       type: u8 }
          - { name: commandClasses, type: bytes }

  - name: Indicator
    wire:
      class_byte: 0x87
      prefix: INDICATOR
    description: |
      Control a node's indicator (LED / buzzer). v1 single value byte:
      0x00 off, 0x01..0x63 level, 0xFF on. SET / GET / REPORT. The v3+
      structured (indicatorId + property/value tuples) form is a follow-up;
      v1 covers the common single-indicator case. decodeReport is hand-
      written; the SET / GET encoders are generated.
    constants:
      - { name: VALUE_OFF, value: 0x00 }
      - { name: VALUE_ON,  value: 0xFF }
    commands:
      - name: Set
        wire:
          byte: 0x01
          payload:
            - "value"
        encode_args:
          - { name: value, type: u8 }
      - name: Get
        wire:
          byte: 0x02
          payload: []
        encode_args: []
      - name: Report
        wire:
          byte: 0x03
        decoded_struct:
          - { name: value, type: u8 }

  - name: Supervision
    wire:
      class_byte: 0x6C
      prefix: SUPERVISION
    description: |
      Explicit-acknowledgement encapsulation (#14). SUPERVISION_GET (0x01)
      wraps an outbound CC frame with a 6-bit session id; the node replies
      with SUPERVISION_REPORT (0x02) carrying a `status` that distinguishes
      *transmitted* (the existing SendData answer) from *applied* (the node
      obeyed). The GET encapsulation is hand-written (dynamic inner
      payload, like Multi Channel); the manifest contributes the command
      bytes, the status codes, and the session-id / more-updates masks.
    constants:
      # properties byte: bit 7 = more-status-updates, bits 0..5 = session id.
      - { name: SESSION_ID_MASK,     value: 0x3F }
      - { name: MORE_UPDATES_FLAG,   value: 0x80 }
      # Report status values.
      - { name: STATUS_NO_SUPPORT,   value: 0x00 }
      - { name: STATUS_WORKING,      value: 0x01 }
      - { name: STATUS_FAIL,         value: 0x02 }
      - { name: STATUS_SUCCESS,      value: 0xFF }
    commands:
      - name: Get
        wire:
          byte: 0x01
      - name: Report
        wire:
          byte: 0x02
        decoded_struct:
          - { name: sessionId,         type: u8 }
          - { name: moreStatusUpdates, type: bool }
          - { name: status,            type: u8 }
          - { name: duration,          type: u8 }


# =====================================================================
# 5. Translation rules
# =====================================================================
# The cc-translator module subscribes to raw transient bus events
# (typically ApplicationCommand), runs application/ codec decoders,
# and republishes typed events declared under `events:` above. The
# generator-emitted CcTranslator.gen.cpp is the only place in the
# daemon that links a `src/zwave-protocol/application/` codec from a
# subscriber outside `src/zwave-protocol/` -- every other module
# stays codec-free and talks only via MessageBus.
#
# Adding a new typed-from-module report is three steps and zero new C++:
#   1. Declare the typed event under `events:` (category transient).
#   2. Add a rule below pointing at the typed event.
#   3. Add a `dbus.signals:` entry triggered_by the typed event.

translations:
  - publishes: BinarySwitchReport
    triggered_by: ApplicationCommand
    decode:
      codec: BinarySwitch.decodeReport
      input: ccData
      # Skip publish when the codec returns std::nullopt -- this
      # ApplicationCommand frame wasn't a Binary Switch Report.
      on_none: skip
    map:
      sourceNodeId: event.sourceNodeId
      state:        "static_cast<u8>(decoded.state)"

  - publishes: IndicatorReport
    triggered_by: ApplicationCommand
    decode:
      codec: Indicator.decodeReport
      input: ccData
      on_none: skip
    map:
      sourceNodeId: event.sourceNodeId
      value:        decoded.value

  - publishes: SupervisionReport
    triggered_by: ApplicationCommand
    decode:
      codec: Supervision.decodeReport
      input: ccData
      on_none: skip
    map:
      sourceNodeId:      event.sourceNodeId
      sessionId:         decoded.sessionId
      moreStatusUpdates: decoded.moreStatusUpdates
      status:            decoded.status
      duration:          decoded.duration

  - publishes: MultiChannelEndPointReport
    triggered_by: ApplicationCommand
